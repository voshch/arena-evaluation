- id: u_001
  scope: universal
  world: ''
  targets: ['D:interaction_unbroken', 'B:intrinsic', 'C:approach']
  text: Three colleagues stand talking further down the robot's route and will not
    stop. Nobody is looking where they are walking, from the start. A visitor walks
    up to the robot halfway along the robot's route, stops right in front of it and
    stares at it for a good half minute.
  oracle:
    D:
      case: interaction_unbroken
      variant: standing
      members: [adult, adult, adult]
      place: {route_fraction: 0.7}
    B:
      case: intrinsic
      select: {amount: all}
      params: {vision_fov: low}
      when: {at: 0}
    C: {profile: adult, route_fraction: 0.5, case: approach, angle: 180, after: stop_facing,
      duration: 30}
- id: u_002
  scope: universal
  world: ''
  targets: ['B:intrinsic']
  text: Half the people here are rushing.
  oracle:
    B:
      case: intrinsic
      select: {amount: half}
      params: {speed: high}
- id: u_003
  scope: universal
  world: ''
  targets: ['C:approach']
  text: An old man crosses the robot's path from the right, just ahead of the robot.
  oracle:
    C: {profile: elder, route_fraction: 0.3, case: approach, angle: 90, after: continue}
- id: u_009
  scope: universal
  world: ''
  targets: ['C:blocking']
  text: A nurse shuffles along slowly further down the robot's route, right in front
    of the robot.
  oracle:
    C: {profile: nurse, route_fraction: 0.7, case: blocking, mode: lead}
- id: u_011
  scope: universal
  world: ''
  targets: ['D:interaction_unbroken']
  text: Two nurses walk in from different rooms, meet right in the robot's way and
    talk forever.
  oracle:
    D:
      case: interaction_unbroken
      variant: meet
      members: [nurse, nurse]
      place: {route_fraction: 0.5}
- id: u_021
  scope: universal
  world: ''
  targets: ['B:erratic_route']
  text: Some people wander about with no settled destination, after half a minute.
  oracle:
    B:
      case: erratic_route
      select: {amount: half}
      when: {at: 30}
- id: v_001
  scope: universal
  world: ''
  targets: ['A:blackout']
  text: A power cut leaves the whole floor in the dark.
  oracle:
    A: {case: blackout}
- id: v_002
  scope: universal
  world: ''
  targets: ['A:blackout', 'D:stubborn']
  text: A power cut leaves the whole floor in the dark, after a while. An old man
    walks towards the robot halfway along the robot's route, wants to keep going and
    refuses to give way.
  oracle:
    A: {case: blackout}
    D: {case: stubborn, profile: elder, route_fraction: 0.5}
- id: v_006
  scope: universal
  world: ''
  targets: ['A:stampede']
  text: The break is over and the whole crowd rushes back to work all at once, pushing
    through, after a while.
  oracle:
    A: {case: stampede}
- id: v_007
  scope: universal
  world: ''
  targets: ['A:evacuation']
  text: An evacuation is called; everybody makes for the exit.
  oracle:
    A: {case: evacuation}
- id: v_008
  scope: universal
  world: ''
  targets: ['A:evacuation']
  text: The fire alarm goes off and everyone heads for the exit, after half a minute.
  oracle:
    A: {case: evacuation}
- id: v_014
  scope: universal
  world: ''
  targets: ['A:busy']
  text: It is visiting hours and the place is packed.
  oracle:
    A: {case: busy}
- id: v_017
  scope: universal
  world: ''
  targets: ['A:stampede', 'D:formation_break', 'B:erratic_route', 'C:blocking']
  text: 'A shift change: everyone surges back to their posts, nobody yields, twenty
    seconds in. A doctor and two visitors are queuing further down the robot''s route
    and the queue breaks up after half a minute, everyone walking off. Some people
    wander about with no settled destination, from the start. An old man shuffles
    along slowly right in the robot''s way, right in front of the robot.'
  oracle:
    A: {case: stampede}
    D:
      case: formation_break
      variant: line
      break: disperse
      members: [doctor, adult, adult]
      place: {route_fraction: 0.7}
      when: {at: 30}
    B:
      case: erratic_route
      select: {amount: half}
      when: {at: 0}
    C: {profile: elder, route_fraction: 0.5, case: blocking, mode: lead}
