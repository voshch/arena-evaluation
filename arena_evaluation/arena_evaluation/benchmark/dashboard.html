<style>
:root {
  --page: #f5f5f5; --surface: #ffffff; --sunk: #ebebeb; --ink: #1f1f1f; --muted: #5c5c5c; --faint: #767676; --line: #dcdcdc;
  --on-accent: #ffffff; --accent: #1a73e8; --acc-bg: #d3e3fd; --acc-ink: #041e49; --ok: #1e8e3e; --failed: #d93025; --partial: #e37400; --skipped: #9e9e9e;
  --term-bg: #1f1f1f; --term-ink: #e6e6e6; --term-dim: #9e9e9e;
  --sans: Roboto, Inter, "Segoe UI", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light; --radius: 12px; --shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 1px 3px 1px rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: block; }
  :root:not([data-theme="light"]) {
    --page: #121212; --surface: #1e1e1e; --sunk: #2c2c2c; --ink: #e6e6e6; --muted: #a8a8a8; --faint: #8a8a8a; --line: #3a3a3a;
    --on-accent: #0b1b33; --accent: #8ab4f8; --acc-bg: #0842a0; --acc-ink: #d3e3fd; --ok: #81c995; --failed: #f28b82; --partial: #fbbc04; --skipped: #9e9e9e;
    --term-bg: #0f0f0f; --term-ink: #e6e6e6; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }
:root[data-theme="dark"] {
  --page: #121212; --surface: #1e1e1e; --sunk: #2c2c2c; --ink: #e6e6e6; --muted: #a8a8a8; --faint: #8a8a8a; --line: #3a3a3a;
  --on-accent: #0b1b33; --accent: #8ab4f8; --acc-bg: #0842a0; --acc-ink: #d3e3fd; --ok: #81c995; --failed: #f28b82; --partial: #fbbc04; --skipped: #9e9e9e;
  --term-bg: #0f0f0f; --term-ink: #e6e6e6; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
.tone-ok { --tone: var(--ok); } .tone-failed { --tone: var(--failed); } .tone-partial { --tone: var(--partial); }
.tone-skipped { --tone: var(--skipped); } .tone-in_progress, .tone-running, .tone-live { --tone: var(--accent); }
.tone-pending, .tone-incomplete, .tone-finished { --tone: var(--faint); } .tone-completed { --tone: var(--ok); }
.tone-stale { --tone: var(--failed); } .tone-warn { --tone: var(--partial); }

header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 32px; background: color-mix(in oklab, var(--page) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font: 500 16px/1 var(--sans); letter-spacing: -.01em; }
.logo { display: block; height: 28px; width: auto; flex: none; }
.logo-dark { display: none; }
.crumb { color: var(--muted); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb:empty { display: none; }
.crumb::before { content: "/"; margin-right: 10px; color: var(--faint); }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-width: 0; }
.conn span { overflow-wrap: anywhere; }
.conn i { flex: none; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.conn.on i { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); animation: pulse 2s infinite; }
.conn.bad { color: var(--failed); } .conn.bad i { background: var(--failed); }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

main { max-width: 1240px; margin: 0 auto; padding: 36px 32px 72px; display: grid; gap: 22px; }
.hero h1 { font: 500 34px/1.15 var(--sans); letter-spacing: -.01em; margin: 0 0 8px; overflow-wrap: anywhere; }
.hero .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); }
.hero .meta .path { font: 12px var(--mono); color: var(--faint); overflow-wrap: anywhere; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; min-width: 0; box-shadow: var(--shadow); }
section > h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 500 19px/1.3 var(--sans); letter-spacing: -.01em; margin: 0 0 16px; }
section > h2 small { font: 400 13px var(--sans); color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { padding: 2px 22px; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat .v { font: 400 34px/1.1 var(--sans); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 18px; color: var(--faint); }
.stat .k { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sunk); margin: 0 0 12px; }
.bar span { display: block; height: 100%; background: var(--tone); border-radius: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12.5px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--tone); }
.legend b { color: var(--ink); font-weight: 500; margin-left: 3px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.6; color: color-mix(in oklab, var(--tone) 82%, var(--ink)); background: color-mix(in oklab, var(--tone) 14%, var(--surface)); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }

.scroll { overflow-x: hidden; }
.dc { display: none; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; white-space: nowrap; }
thead th { color: var(--faint); font-weight: 500; font-size: 12px; padding-top: 0; border-bottom: 1px solid var(--line); }
tbody tr + tr td, tbody tr + tr th { border-top: 1px solid color-mix(in oklab, var(--line) 70%, transparent); }
tbody tr:hover td { background: color-mix(in oklab, var(--sunk) 55%, transparent); }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
.num { text-align: right; }
td.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .bad { color: var(--failed); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.runlink { font: 500 15px var(--sans); }
.mini { width: 120px; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 10px; }
.mini span { display: block; height: 100%; background: var(--tone); }

.tiles { border-collapse: separate; border-spacing: 6px; }
.tiles thead th { border: 0; text-align: center; padding: 0 4px 4px; }
.tiles thead th:first-child { text-align: left; }
.tiles .w { display: block; font-weight: 400; color: var(--faint); font-size: 11.5px; }
.tiles tbody th { font: 500 14.5px var(--sans); padding: 0 10px 0 0; border: 0; }
.tiles tbody tr + tr td, .tiles tbody tr + tr th { border-top: 0; }
.tiles tbody tr:hover td { background: none; }
.tile { position: relative; min-width: 76px; height: 48px; padding: 0; text-align: center; border-radius: 9px; color: color-mix(in oklab, var(--tone) 80%, var(--ink)); background: color-mix(in oklab, var(--tone) 13%, var(--surface)); border: 1px solid color-mix(in oklab, var(--tone) 22%, transparent); font-size: 13px; font-weight: 500; overflow: hidden; }
.tile.tone-pending { color: var(--faint); background: var(--sunk); border-color: transparent; }
.tile small { display: block; font-weight: 400; font-size: 10.5px; opacity: .8; margin-top: 1px; }
.tile .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--tone); }

  else if (p.type === "boolean") return `<label class="check" title="${tip}"><input type="checkbox" ${attrs}${dv ? " checked" : ""}>${name}</label>`;
  else if (p.type === "number" || p.type === "integer") {
    const lo = p.minimum != null ? p.minimum : p.exclusiveMinimum != null && p.type === "integer" ? p.exclusiveMinimum + 1 : null;
    const hi = p.maximum != null ? p.maximum : p.exclusiveMaximum != null && p.type === "integer" ? p.exclusiveMaximum - 1 : null;
    ctl = `<input type="number" ${attrs}${lo != null ? ` min="${lo}"` : ""}${hi != null ? ` max="${hi}"` : ""} step="${p.type === "integer" ? 1 : "any"}"${dv != null ? ` value="${esc(dv)}"` : ""}>`;
  } else ctl = `<input ${attrs}${dv != null ? ` value="${esc(Array.isArray(dv) ? dv.join(", ") : dv)}"` : ""}>`;
  return block ? `<div class="dlg-field"><label for="${id}" title="${tip}">${name}</label>${ctl}</div>` : `<label class="note" for="${id}" title="${tip}">${name}</label>${ctl}`;
}
function readParams(root, key, params) {
  const body = {};
  for (const p of params) {
    const el = root.querySelector(`[data-for="${key}"][data-ap="${CSS.escape(p.name)}"]`);
    if (!el) continue;
    let v;
    if (el.type === "checkbox") v = el.checked;
    else if (el.value.trim() === "") continue;
    else if (p.type === "number" || p.type === "integer") { v = Number(el.value); const bad = badBound(p, v); if (bad) return {error: bad}; }
    else if (p.type === "array") v = el.value.split(",").map((x) => x.trim()).filter(Boolean);
    else v = el.value.trim();
    body[p.name] = v;
  }
  return {body};
}
function bindEnums(root, params, disposers) {
  for (const p of params) {
    if (!p.enum) continue;
    const el = root.querySelector(`[data-ap="${CSS.escape(p.name)}"]`);
    if (el) disposers.push(bindCombo(el, p.enum.map(String)));
  }
}
function liveCombo(el, kind, worldEl, onPick, base) {
  let dispose = null, seq = 0, dead = false;
  const refill = async () => {
    const mine = ++seq;
    const w = worldEl && worldEl !== el ? worldEl.value.trim() : "";
    let items = [], note = "";
    try { items = (await api(`/api/runtime/catalog?kind=${encodeURIComponent(kind)}${w ? `&world=${encodeURIComponent(w)}` : ""}`)).items; } catch (e) { note = e.message; }
    if (dead || mine !== seq) return;
    if (dispose) dispose();
    dispose = bindCombo(el, items, onPick);
    el.placeholder = note || base;
  };
  refill();
  return {refill, stop: () => { dead = true; if (dispose) dispose(); }};
}
function taskForm(root, o, init, worldEl) {
  const axes = Object.keys(o.task_modes || {});
  const sel = {}, vals = {}, shown = new Map(), pickers = [], inner = [];
  for (const a of axes) sel[a] = [].concat((init.modes || {})[a] || []).filter((m) => m in o.task_modes[a].modes);
  const first = JSON.parse(JSON.stringify(sel));
  const baseOf = (p) => (init.params && p.name in init.params ? init.params[p.name] : p.default);
  const elType = (p) => String(p.type || "string").replace(/_array$/, "");
  const isArray = (p) => String(p.type || "").endsWith("_array");
  const one = (p, text) => {
    const t = elType(p);
    if (t === "bool") return text === "true";
    if (t === "integer") return Number.parseInt(text, 10);
    if (t === "double") return Number.parseFloat(text);
    return text;
  };
  const show = (v) => (Array.isArray(v) ? v.join(", ") : v == null ? "" : String(v));
  const parse = (p, el) => {
    if (el.type === "checkbox") return el.checked;
    if (isArray(p)) return el.value.split(",").map((x) => x.trim()).filter(Boolean).map((x) => one(p, x));
    if (el.value.trim() === "") return baseOf(p);
    const t = elType(p);
    if (t === "integer" || t === "double") { const n = one(p, el.value); return Number.isNaN(n) ? baseOf(p) : n; }
    return el.value;
  };
  root.className = "tform";
  root.innerHTML = axes.map((a) => `<div class="axis"><div class="axis-h"><label for="tf-${esc(a)}">${esc(label(a))}</label><div class="pick"><span class="chips" data-chips="${esc(a)}"></span><input id="tf-${esc(a)}" class="combo" data-pick="${esc(a)}" placeholder="${o.task_modes[a].multi ? "add a mode" : "pick a mode"}"></div></div><div data-params="${esc(a)}"></div></div>`).join("");
  const drawChips = (a) => {
    const multi = o.task_modes[a].multi;
    root.querySelector(`[data-chips="${a}"]`).innerHTML = multi ? sel[a].map((m) => `<span class="chip rm">${esc(m)}<button type="button" data-rm="${esc(m)}" data-axis="${esc(a)}" title="Remove ${esc(m)} from ${esc(label(a))}">X</button></span>`).join("") : "";
    root.querySelector(`[data-pick="${a}"]`).value = multi ? "" : sel[a][0] || "";
  };
  const control = (p) => {
    const attr = `id="tp-${esc(slug(p.name))}" data-p="${esc(p.name)}"${p.read_only ? " disabled" : ""}`;
    const t = elType(p);
    if (p.choices && !isArray(p)) return `<input class="combo" ${attr} data-kind="choice">`;
    if (p.catalog) return `<input class="combo" ${attr} data-kind="catalog">`;
    if (t === "bool" && !isArray(p)) return `<input type="checkbox" ${attr}>`;
    if ((t === "integer" || t === "double") && !isArray(p)) {
      const r = p.range || [];
      return `<input type="number" ${attr}${r[0] != null ? ` min="${r[0]}"` : ""}${r[1] != null ? ` max="${r[1]}"` : ""} step="${r[2] != null ? r[2] : t === "integer" ? 1 : "any"}">`;
    }
    return `<input ${attr}${isArray(p) ? ' placeholder="comma separated"' : ""}>`;
  };
  let refills = [];
  const catalog = (el, p) => {
    const lc = liveCombo(el, p.catalog, worldEl, (v) => { vals[p.name] = v; }, `pick or type ${p.catalog}`);
    inner.push(lc.stop);
    return lc.refill;
  };
  const drawParams = () => {
    while (inner.length) inner.pop()();
    refills = [];
    shown.clear();
    for (const a of axes) {
      const groups = sel[a].map((m) => {
        const ps = o.task_modes[a].modes[m].params.filter((p) => !shown.has(p.name));
        ps.forEach((p) => shown.set(p.name, p));
        return ps.length ? `<fieldset class="mgrp"><legend>${esc(m)}</legend>${ps.map((p) => `<div class="prm${p.read_only ? " off" : ""}"><label for="tp-${esc(slug(p.name))}" title="${esc(p.description || "")}">${esc(p.label || p.leaf)}</label>${control(p)}</div>`).join("")}</fieldset>` : "";
      });
      root.querySelector(`[data-params="${a}"]`).innerHTML = groups.join("");
    }
    for (const el of root.querySelectorAll("[data-p]")) {
      const p = shown.get(el.dataset.p);
      if (!(p.name in vals)) vals[p.name] = baseOf(p);
      if (el.type === "checkbox") el.checked = !!vals[p.name]; else el.value = show(vals[p.name]);
      el.title = p.description || "";
      if (el.dataset.kind === "choice") inner.push(bindCombo(el, p.choices.map(String), (v) => { vals[p.name] = one(p, v); }));
      else if (el.dataset.kind === "catalog") refills.push(catalog(el, p));
    }
  };
  const setMode = (a, name) => {
    const multi = o.task_modes[a].multi;
    if (name in o.task_modes[a].modes) sel[a] = multi ? (sel[a].includes(name) ? sel[a] : [...sel[a], name]) : [name];
    else if (!multi && name === "") sel[a] = [];
    drawChips(a);
    drawParams();
  };
  root.addEventListener("input", (ev) => {
    const el = ev.target.closest("[data-p]");
    if (el && el.dataset.kind !== "choice") vals[el.dataset.p] = parse(shown.get(el.dataset.p), el);
  });
  root.addEventListener("change", (ev) => {
    const el = ev.target.closest("[data-p]");
    if (el) {
      const p = shown.get(el.dataset.p);
      if (el.dataset.kind !== "choice") vals[p.name] = parse(p, el);
      else if (p.choices.map(String).includes(el.value)) vals[p.name] = one(p, el.value);
      else el.value = show(vals[p.name]);
      return;
    }
    const pick = ev.target.closest("[data-pick]");
    if (pick) setMode(pick.dataset.pick, pick.value.trim());
  });
  root.addEventListener("click", (ev) => {
    const rm = ev.target.closest("[data-rm]");
    if (!rm) return;
    const a = rm.dataset.axis;
    sel[a] = sel[a].filter((m) => m !== rm.dataset.rm);
    drawChips(a);
    drawParams();
  });
  for (const a of axes) {
    drawChips(a);
    pickers.push(bindCombo(root.querySelector(`[data-pick="${a}"]`), Object.keys(o.task_modes[a].modes), (v) => setMode(a, v)));
  }
  drawParams();
  let timer = 0;
  const onWorld = () => { clearTimeout(timer); timer = setTimeout(() => refills.forEach((f) => f()), 250); };
  if (worldEl) { worldEl.addEventListener("input", onWorld); worldEl.addEventListener("change", onWorld); }
  return {
    read() {
      const modes = {}, params = {};
      for (const a of axes) if (!same(sel[a], first[a]) && (sel[a].length || o.task_modes[a].multi)) modes[a] = sel[a];
      for (const [name, p] of shown) if (!same(vals[name], baseOf(p))) params[name] = vals[name];
      return {modes, params};
    },
    dispose() {
      clearTimeout(timer);
      while (inner.length) inner.pop()();
      pickers.forEach((d) => d());
      if (worldEl) { worldEl.removeEventListener("input", onWorld); worldEl.removeEventListener("change", onWorld); }
    },
  };
}

function stepBar(steps, total) {
  const spans = STATUSES.filter((s) => s !== "pending" && steps[s]).map((s) => `<span class="tone-${s}" style="width:${pct(steps[s], total)}%" title="${label(s)}: ${steps[s]}"></span>`).join("");
  const legend = STATUSES.map((s) => `<span class="tone-${s}"><i></i>${label(s)}<b>${steps[s] || 0}</b></span>`).join("");
  return `<div class="bar">${spans}</div><div class="legend">${legend}</div>`;
}

async function listPage() {

  $("main").innerHTML = `<div class="hero-row"><div class="hero"><h1>Benchmark runs</h1><div class="meta"><span class="path" id="root"></span></div></div><button class="btn primary" id="new-run" type="button" hidden>New Run</button></div><section id="runs">${loading("Loading runs")}</section>`;

  const cachedId = stash.get("/api/identity");

        {cls: "wrap", h: `<a class="runlink" href="${href}">${esc(r.run_id)}</a><div class="faint">${esc(r.suite)} / ${esc(r.contest)} on ${esc(r.simulator)}${r.lanes.length ? `, lanes ${esc(r.lanes.join(", "))}` : ""}</div>`},
        `${pill(r.state, r.state)}${stale ? " " + pill("stale", "stale") : ""}`,
        {cls: `tone-${r.steps.failed ? "failed" : "ok"}`, h: `<span class="mini"><span style="width:${pct(done, r.steps_total)}%"></span></span>${done}<span class="faint"> / ${r.steps_total}</span>`},
        {cls: `num ${r.steps.failed ? "bad" : "faint"}`, h: String(r.steps.failed || 0)},

function runPage(runId) {
  const base = `/api/runs/${encodeURIComponent(runId)}`;
  const state = {detail: null, live: [], offset: 0, sims: {}, logs: {}, logTab: null, step: null, outcome: null, rows: []};
  document.title = `${runId} - Arena`;
  $("title").textContent = runId;
  document.body.classList.add("run");
  $("main").innerHTML = `<div class="pg" id="pg">
    <section class="summary"><div class="sum-top"><div class="hero" id="hero"><h1>${esc(runId)}</h1><div class="meta"></div></div><div id="stats" class="stats"></div></div><div id="bars"></div></section>
    <div class="cols">
      <div class="col">
        <section class="keep"><h2>Environments <small id="lanes-note"></small></h2><div id="lanes" class="body"></div></section>
        <section class="fit"><h2>Steps</h2><div id="grid" class="body scroll"></div></section>
      </div>
      <div class="col">
        <section class="grow"><h2>Recent episodes</h2><div id="recent" class="body scroll"></div></section>
        <section class="grow log"><h2>Runner log <span class="tabs" id="log-tabs"></span></h2><pre id="log"></pre></section>
      </div>
    </div></div><div id="dt" hidden></div>`;

  const now = () => Date.now() / 1000 + state.offset;

  function trackSim(lanes) {
    const wall = now();
    for (const l of lanes) {
      const prev = state.sims[l.file];
      if (!prev || prev.sim !== l.sim_time) state.sims[l.file] = {sim: l.sim_time, since: wall};
    }
  }

  function renderSummary() {
    const d = state.detail; if (!d) return;
    const ep = d.episodes;
    const done = d.steps_total - (d.steps.pending || 0) - (d.steps.in_progress || 0);
    const outcomes = Object.entries(ep.outcomes).sort().map(([k, v]) => `${esc(k)} ${v}`).join(", ") || "no episodes yet";
    document.querySelector("#hero .meta").innerHTML = `${pill(d.state, d.state)}<span>${esc(d.suite)} / ${esc(d.contest)} on ${esc(d.simulator)}</span><span>${d.env_n} env${d.env_n === 1 ? "" : "s"}${d.headless ? ", headless" : ""}</span><span title="${esc(d.created_at)} UTC">started ${esc(ago(d.created_at))}</span><span class="path">${esc(d.run_dir)}</span>${d.state === "running" ? (runActions().length ? runActions() : ["stop_run"]).map((k) => `<button class="btn sm${destructive(k) ? " danger" : ""}" type="button" data-runact="${esc(k)}" title="${esc(doc(k, "Stop this run"))}">${esc(titleCase(k))}</button>`).join("") : ""}`;
    $("stats").innerHTML = `
        <div class="stat"><div class="v">${done}<small> / ${d.steps_total}</small></div><div class="k">steps done</div></div>
        <div class="stat"><div class="v">${ep.logged}<small> / ${ep.planned}</small></div><div class="k">episodes logged</div></div>
        <div class="stat"><div class="v">${ep.per_min}</div><div class="k">episodes per minute, last ${dur(ep.rate_window_s)}</div></div>
        <div class="stat"><div class="v">${ep.eta_s == null ? "-" : dur(ep.eta_s)}</div><div class="k">${d.state === "running" ? "estimated time left" : "ETA"}</div></div>`;
    $("bars").innerHTML = `${stepBar(d.steps, d.steps_total)}
      <div class="legend" style="margin-top:10px"><span>outcomes: ${outcomes}</span>${d.runner_pids.length ? `<span>runner pid ${d.runner_pids.map(esc).join(", ")}</span>` : ""}</div>`;
  }

  function renderLanes() {
    const lanes = state.live;
    if (!lanes.length) { $("lanes").innerHTML = `<div class="empty">No live state yet. Runners write it once their first env block starts.</div>`; return; }
    const t = now();
    const busy = lanes.reduce((a, l) => a + (l.finished ? 0 : l.slots.length), 0);
    $("lanes-note").textContent = `${busy} busy across ${lanes.length} lane${lanes.length === 1 ? "" : "s"}`;
    $("lanes").innerHTML = lanes.map((l) => {
      const age = Math.max(0, t - l.updated_at);
      const stale = !l.finished && age > 10;
      const sim = state.sims[l.file];
      const frozen = !l.finished && !stale && sim && l.sim_time != null && t - sim.since > SIM_FROZEN_S;
      const tone = l.finished ? "finished" : stale ? "stale" : frozen ? "warn" : "live";
      const badges = [
        l.finished ? pill("finished", "finished") : stale ? pill("stale", `stale ${dur(age)}`) : pill("live", "live"),
        frozen ? pill("warn", `sim not advancing ${dur(t - sim.since)}`) : "",
      ].join(" ");
      const slots = l.slots.length ? tbl([{h: "Env"}, {h: "Contestant", p: 1}, {h: "Stage", p: 2}, {h: "State", p: 6}, {h: "Episode", p: 3}, {h: "Wall", p: 4, cls: "num"}, {h: "Sim", p: 5, cls: "num"}], l.slots.map((s) => ({attrs: `class="clickrow" tabindex="0" data-open="${esc("slot:" + s.step_key)}"`, cells: [
        `<span class="chip">${s.env_id == null ? "-" : "env_" + s.env_id}</span>`, esc(s.contestant), esc(s.stage), {cls: "muted", h: esc(String(s.state).toLowerCase())},
        {cls: "tone-in_progress", h: s.ep_total ? `<span class="mini" style="width:70px"><span style="width:${pct(s.ep_idx + 1, s.ep_total)}%"></span></span>${s.ep_idx + 1}<span class="faint"> / ${s.ep_total}</span>` : "-"},
        {cls: "num", h: dur(t - s.started_at)}, {cls: "num muted", h: l.sim_time != null && s.sim_start != null ? dur(l.sim_time - s.sim_start) : "-"}]})), "pinhead")
        : `<div class="empty">${l.finished ? "Runner exited." : "No env busy."}</div>`;
      return `<div class="lane tone-${tone}"><div class="head"><b>${esc(l.lane || "main")}</b>${badges}
        <span class="facts">pid ${l.pid}, ${l.steps.completed} of ${l.total_steps} steps, updated ${dur(age)} ago${l.sim_time != null ? `, sim ${l.sim_time.toFixed(1)} s` : ""}</span></div>
        <div class="scroll">${slots}</div></div>`;
    }).join("");
    fitAll();
  }

  const errOf = (key) => (state.detail ? state.detail.failed.find((f) => f.key === key) : undefined);
  const errText = (key) => { const f = errOf(key); return f && f.error_detail ? `\n${f.error_kind || "error"}: ${f.error_detail}` : ""; };

  function renderGrid() {
    const d = state.detail; if (!d) return;
    const stages = [], contestants = [], cells = {};
    for (const c of d.grid) {
      if (!stages.some((s) => s.name === c.stage)) stages.push({name: c.stage, world: c.world});
      if (!contestants.includes(c.contestant)) contestants.push(c.contestant);
      cells[c.contestant + "\u0000" + c.stage] = c;
    }
    const live = {};
    for (const l of state.live) if (!l.finished) for (const s of l.slots) live[s.step_key] = s;
    const head = stages.map((s) => `<th>${esc(s.name)}<span class="w">${esc(s.world)}</span></th>`).join("");
    const body = contestants.map((name) => `<tr><th>${esc(name)}</th>${stages.map((s) => {
      const c = cells[name + "\u0000" + s.name];
      if (!c) return "<td></td>";
      const tip = `${c.key}: ${label(c.status)}${c.env_id != null ? ", env_" + c.env_id : ""}${c.error_kind ? ", " + c.error_kind : ""}, ${c.episodes_run}/${c.episodes_planned} episodes, ${c.episodes_failed} failed${errText(c.key)}`;
      const slot = c.status === "in_progress" ? live[c.key] : undefined;
      if (slot && slot.ep_total) {
        return `<td class="tile tone-in_progress${state.step === c.key ? " sel" : ""}" data-key="${esc(c.key)}" title="${esc(tip)}"><span class="opt">episode </span>${slot.ep_idx + 1}/${slot.ep_total}<small>${slot.env_id == null ? "spawning" : "env_" + esc(slot.env_id)}</small><span class="fill" style="width:${pct(slot.ep_idx, slot.ep_total)}%"></span></td>`;
      }
      return `<td class="tile tone-${esc(c.status)}${state.step === c.key ? " sel" : ""}" data-key="${esc(c.key)}" title="${esc(tip)}, click for its episodes">${c.episodes_run}/${c.episodes_planned}<span class="fill" style="width:${pct(c.episodes_run, c.episodes_planned)}%"></span></td>`;
    }).join("")}</tr>`).join("");
    $("grid").innerHTML = `<table class="tiles"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table>`;
    if ($("grid").querySelector("table").offsetWidth > $("grid").clientWidth + 1 && $("grid").clientWidth) renderHeat(stages, contestants, cells, live);
  }

  function renderHeat(stages, contestants, cells, live) {
    const heads = stages.map((s, j) => `<div class="hh" title="${esc(s.name)}, ${esc(s.world)}">${j === 0 || (j + 1) % 5 === 0 ? j + 1 : ""}</div>`).join("");
    const rows = contestants.map((name) => {
      let done = 0, failed = 0;
      const row = stages.map((s) => {
        const c = cells[name + "\u0000" + s.name];
        if (!c) return `<div></div>`;
        if (["ok", "partial", "failed", "skipped"].includes(c.status)) done++;
        if (c.status === "failed") failed++;
        const slot = c.status === "in_progress" ? live[c.key] : undefined;
        const where = slot ? `, episode ${slot.ep_idx + 1}/${slot.ep_total} on ${slot.env_id == null ? "a spawning env" : "env_" + slot.env_id}` : c.env_id != null ? `, env_${c.env_id}` : "";
        const tip = `${c.key} (${s.world}): ${label(c.status)}${where}${c.error_kind ? ", " + c.error_kind : ""}, ${c.episodes_run}/${c.episodes_planned} episodes, ${c.episodes_failed} failed${errText(c.key)}`;
        return `<div class="hc tone-${esc(c.status)}${state.step === c.key ? " sel" : ""}" data-key="${esc(c.key)}" title="${esc(tip)}, click for its episodes"></div>`;
      }).join("");
      return `<div class="hn" title="${esc(name)}">${esc(name)}</div>${row}<div class="hs">${done}/${stages.length}${failed ? ` <span class="bad">${failed} failed</span>` : ""}</div>`;
    }).join("");
    $("grid").innerHTML = `<div class="heat" style="--cols:${stages.length}"><div class="hn corner"></div>${heads}<div class="hs corner"></div>${rows}</div>
      <div class="heat-note">${contestants.length} contestants by ${stages.length} stages, hover a cell for its step, click it for its episodes</div>`;
  }

  async function renderRecent() {
    const d = state.detail; if (!d) return;
    const tone = (o) => (o === "success" ? "ok" : o === "skipped" ? "skipped" : ["running", "queued"].includes(o) ? "running" : "failed");
    let rows = d.recent, note = "";
    const step = state.step, outcome = state.outcome;
    if (step || outcome) {
      const got = await api(`${base}/progress?${step ? `step=${encodeURIComponent(step)}&` : ""}last=200`);
      if (state.step !== step || state.outcome !== outcome) return;
      rows = got.rows.slice().reverse().map((r) => ({...r, outcome: OUTCOMES[r.outcome_state] || r.outcome_state}));
      if (outcome) rows = rows.filter((r) => r.outcome === outcome);
      note = `${rows.length} episode${rows.length === 1 ? "" : "s"}${step ? " of this step" : ""}${outcome ? ` with outcome ${outcome}` : ""}`;
    }
    const fail = step ? errOf(step) : undefined;
    const chips = ["", ...Object.keys(d.episodes.outcomes).sort()].map((o) => `<button class="chipbtn" type="button" data-outcome="${esc(o)}" aria-pressed="${(state.outcome || "") === o}" title="${o ? `Show only ${esc(o)} episodes` : "Show episodes of every outcome"}">${o ? esc(titleCase(o)) : "All"}</button>`).join("");
    const head = `${step ? `<div class="filter">${pill("running", step)}<span>${esc(note)}</span><button class="btn sm" type="button" data-open="step:${esc(step)}" title="Show every field of this step">Details</button><button class="btn sm" id="step-clear" type="button" title="Show the latest episodes of every step again">Show All</button></div>` : ""}${fail ? `<div class="banner tone-failed steperr"><b>${esc(fail.error_kind || "failed")}</b>${fail.error_detail ? `: ${esc(fail.error_detail)}` : ""}</div>` : ""}<div class="filter">${chips}${!step && note ? `<span>${esc(note)}</span>` : ""}</div>`;
    state.rows = rows;
    if (!rows.length) { $("recent").innerHTML = `${head}<div class="empty">No episodes logged${step ? " for this step" : ""}${outcome ? ` with outcome ${esc(outcome)}` : ""} yet.</div>`; return; }
    $("recent").innerHTML = `${head}${tbl([{h: "Time (UTC)", p: 6}, {h: "Step"}, {h: "Env", p: 5, cls: "num"}, {h: "Episode", p: 1, cls: "num"}, {h: "World", p: 7}, {h: "Outcome", p: 2}, {h: "Runtime", p: 3, cls: "num"}, {h: "Info", p: 4}], rows.map((r) => ({attrs: `class="clickrow" tabindex="0" data-open="${esc("ep:" + r.step_key + ":" + r.episode_id)}"`, cells: [
      {cls: "muted", h: esc(when(r.ts_iso))}, esc(r.step_key), {cls: "num", h: esc(r.env_id)}, {cls: "num", h: esc(r.episode_id)}, {cls: "muted", h: esc(r.world)},
      pill(tone(r.outcome), r.outcome + (r.error_kind ? `, ${r.error_kind}` : "")), {cls: "num", h: r.runtime_s === "" ? "-" : dur(Number(r.runtime_s))},
      {cls: "wrap faint", h: `<span title="${esc(r.outcome_info)}">${esc(r.outcome_info)}</span>`}]})), "pinhead")}`;
    fitAll();
  }

  $("grid").addEventListener("click", (ev) => {
    const cell = ev.target.closest("[data-key]");
    if (!cell) return;
    state.step = state.step === cell.dataset.key ? null : cell.dataset.key;
    renderGrid();
    renderRecent();
  });
  $("recent").addEventListener("click", (ev) => {
    const chip = ev.target.closest("[data-outcome]");
    if (chip) { state.outcome = chip.dataset.outcome || null; renderRecent(); return; }
    const det = ev.target.closest("button[data-open]");
    if (det) { router.open(det.dataset.open); return; }
    if (!ev.target.closest("#step-clear")) return;
    state.step = null;
    renderGrid();
    renderRecent();
  });

  function logLine(line) {
    const text = esc(line);
    if (/\b(ERROR|CRITICAL|Traceback)\b/.test(line)) return `<span class="e">${text}</span>`;
    if (/\bWARN(ING)?\b/.test(line)) return `<span class="w">${text}</span>`;
    if (/^\[(bash|flatsim|gz|isaac)/.test(line)) return `<span class="d">${text}</span>`;
    return text;
  }

  function renderLogs() {
    const names = Object.keys(state.logs);
    const pre = $("log");
    if (!names.length) { $("log-tabs").innerHTML = ""; pre.textContent = "No runner log yet."; return; }
    if (!names.includes(state.logTab)) state.logTab = names[0];
    $("log-tabs").innerHTML = names.length > 1 ? names.map((n) => `<button type="button" data-name="${esc(n)}" title="Show the ${esc(n)} log"${n === state.logTab ? ' class="on"' : ""}>${esc(n)}</button>`).join("") : `<span class="faint mono">${esc(names[0])}</span>`;
    const pinned = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    pre.innerHTML = state.logs[state.logTab].map(logLine).join("\n");
    if (pinned) pre.scrollTop = pre.scrollHeight;
  }

  $("log-tabs").addEventListener("click", (ev) => {
    const name = ev.target.closest("button")?.dataset.name;
    if (!name) return;
    state.logTab = name;
    $("log").scrollTop = 0;
    renderLogs();
    $("log").scrollTop = $("log").scrollHeight;
  });

  const router = detailRouter((key) => {
    const at = key.indexOf(":");
    const kind = key.slice(0, at), id = key.slice(at + 1);
    if (kind === "ep") {
      const r = [...state.rows, ...(state.detail ? state.detail.recent : [])].find((x) => `${x.step_key}:${x.episode_id}` === id);
      return r ? {title: `${esc(r.step_key)} <span class="faint">episode ${esc(r.episode_id)}</span>`, fields: omit(r, "step_key", "episode_id")} : null;
    }
    if (kind === "step") {
      const c = state.detail ? state.detail.grid.find((x) => x.key === id) : null;
      const f = errOf(id);
      return c ? {title: esc(c.key), fields: omit(f ? {...c, error_detail: f.error_detail} : c, "key")} : null;
    }
    if (kind === "slot") {
      for (const l of state.live) { const s = l.slots.find((x) => x.step_key === id); if (s) return {title: esc(s.step_key), fields: omit({lane: l.lane || "main", ...s}, "step_key")}; }
    }
    return null;
  });
  clickRows($("pg"), (row) => { if (row.dataset.open) router.open(row.dataset.open); });
  $("hero").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-runact]");
    if (!btn) return;
    const key = btn.dataset.runact;
    if (destructive(key) || !(key in ((OPT && OPT.actions) || {}))) {
      const ok = await ask({title: `${human(key)} ${runId}`, html: `<p>${esc(doc(key, "Stops this run."))}</p>`, ok: titleCase(key), tip: doc(key, "Stop this run"), danger: true});
      if (!ok) return;
    }
    try { await post(`${base}/${key.split("_")[0]}`, {}); conn(`${key.split("_")[0]} ${runId}`, "on"); } catch (e) { conn(`${e.message}${e.hint ? ", " + e.hint : ""}`, "bad"); return; }
    pending.run = true; flush();
  });
  function applyDetail(d, at) {
    state.detail = d; state.offset = d.now - at / 1000; state.live = d.live; trackSim(d.live);
    renderSummary(); renderLanes(); renderGrid(); renderRecent(); router.render();
  }
  async function loadDetail() { applyDetail(await api(base), Date.now()); }
  async function loadLive() {
    const d = await api(`${base}/live`);
    state.offset = d.now - Date.now() / 1000; state.live = d.live; trackSim(d.live); renderLanes(); renderGrid(); router.render();
  }
  async function loadLogs() { state.logs = (await api(`${base}/log?tail=200`)).logs; renderLogs(); }
  refits.add(() => { if (state.detail) renderGrid(); });

  const pending = {run: false, live: false};
  let busy = false;
  async function flush() {
    if (busy) return;
    busy = true;
    try {
      while (pending.run || pending.live) {
        if (pending.run) { pending.run = false; pending.live = false; await Promise.all([loadDetail(), loadLogs()]); }
        else { pending.live = false; await loadLive(); }
        await new Promise((r) => setTimeout(r, 1000));
      }
      conn(`live, updated ${new Date().toLocaleTimeString()}`, "on");
    } catch (e) { conn(e.message, "bad"); }
    finally { busy = false; }
  }

  const cachedRun = stash.get(base);
  if (cachedRun) { applyDetail(cachedRun.d, cachedRun.t); cachedNote(cachedRun); }
  const cachedLog = stash.get(`${base}/log?tail=200`);
  if (cachedLog) { state.logs = cachedLog.d.logs; renderLogs(); }
  loadOptions().then(() => { if (state.detail) renderSummary(); });
  pending.run = true; flush();
  const events = new EventSource(`${BASE}${base}/events`);
  events.addEventListener("run", () => { pending.run = true; flush(); });
  events.addEventListener("live", () => { pending.live = true; flush(); });
  events.onopen = () => conn("live", "on");
  events.onerror = () => conn("disconnected, retrying", "bad");
  setInterval(renderLanes, 1000);
}

function runtimePage() {
  document.body.classList.add("run");
  document.title = "Runtime - Arena";
  const st = {snap: null, options: OPT, offset: 0, cam: null, camTimer: null, log: [], busy: false, tasks: {}, form: null, simDisp: [], spawnStop: null};
  const envBtn = (act, text, env, extra, attrs = "") => `<button class="btn sm ctlbtn${extra}" data-act="${act}" data-env="${env}" title="${esc(act === "change" ? "Reset this env after changing its world, seed, task modes or params" : doc(act))}"${attrs}>${text}</button>`;
  $("main").innerHTML = `<div class="pg" id="pg">
    <section class="summary"><div class="sum-top"><div class="hero"><h1>Runtime</h1><div class="meta" id="rt-meta"></div><button class="btn sm danger" id="rt-shutdown" type="button" hidden title="Stop this container's runtime and every env in it">Stop Runtime</button></div><div id="rt-stats" class="stats"></div></div><div id="rt-banner" class="banner"></div></section>
    <div class="cols">
      <div class="col">
        <section class="grow"><h2>Environments <small id="rt-note"></small><span class="spacer"></span><button class="btn sm ctlbtn${destructive("despawn_all") ? " danger" : ""}" data-act="despawn_all" title="${esc(doc("despawn_all"))}">${esc(titleCase("despawn_all"))}</button></h2><div id="rt-envs" class="body scroll"></div></section>
        <section class="keep" id="cam-box" hidden><h2>Camera <small id="cam-note"></small><span class="spacer"></span><button class="btn sm" id="cam-close" type="button" title="Hide the camera frame">Close Camera</button></h2><div class="body cam"><img id="cam-img" alt="camera"></div></section>
      </div>
      <div class="col">
        <section class="fit"><h2>Spawn envs</h2><div class="body" id="rt-spawn">${loading("Loading options")}</div></section>
        <section class="fit"><h2>Simulation</h2><div class="body">
          <div id="rt-sim">${loading("Loading controls")}</div>
          <div class="ctl note" id="rt-holds"></div>
          <div class="ctl note" id="rt-lockstep"></div>
        </div></section>
        <section class="grow"><h2>Activity</h2><div class="body"><ul class="activity" id="rt-activity"><div class="empty">Actions from this page show up here, with what the runtime answered.</div></ul></div></section>
      </div>
    </div></div><div id="dt" hidden></div>`;

  const now = () => Date.now() / 1000 + st.offset;
  const locked = () => !st.snap || !st.snap.running || !!st.snap.benchmark;
  const envOf = (id) => (st.snap && st.snap.running ? st.snap.envs.find((e) => e.env_id === id) : undefined);

  const logKey = `arena-activity:${BASE || "/"}`;
  function renderLog() {
    if (!st.log.length) return;
    const state = (x) => (x.tone === "in_progress" ? working("sent") : x.tone === "lost" ? pill("pending", "no answer seen") : pill(x.tone, x.tone === "ok" ? "done" : "failed"));
    $("rt-activity").innerHTML = st.log.map((x) => `<li><span class="t">${esc(x.t)}</span><span class="what">${state(x)}<b>${esc(x.what)}</b></span>${x.msg ? `<span class="msg">${esc(x.msg)}</span>` : ""}${x.hint ? `<span class="hint">${esc(x.hint)}</span>` : ""}</li>`).join("");
    try { localStorage.setItem(logKey, JSON.stringify(st.log)); } catch (e) { conn(`activity not saved: ${e.message}`, "bad"); }
  }
  function logEntry(entry) {
    st.log.unshift(entry);
    st.log = st.log.slice(0, 40);
    renderLog();
  }
  try {
    st.log = JSON.parse(localStorage.getItem(logKey) || "[]").map((x) => (x.tone === "in_progress" ? {...x, tone: "lost", msg: "the page reloaded before the runtime answered"} : x));
  } catch (e) { st.log = []; }
  renderLog();

  async function act(action, envId, body, confirmText, okLabel) {
    if (confirmText && !(await ask({title: confirmText, html: `<p>${esc(doc(action))}</p>`, ok: okLabel || "OK", tip: doc(action), danger: true}))) return;
    const what = `${label(action)}${envId != null ? ` env ${envId}` : ""}${body && body.world ? ` into ${body.world}` : ""}${body && body.seed != null && body.seed >= 0 ? ` seed ${body.seed}` : ""}`;
    const entry = {t: new Date().toLocaleTimeString(), what, tone: "in_progress"};
    logEntry(entry);
    try {
      const out = await post(envId != null ? `/api/runtime/envs/${envId}/${action}` : `/api/runtime/${action}`, body);
      Object.assign(entry, {tone: "ok", msg: JSON.stringify(out.result).slice(0, 220)});
    } catch (e) {
      Object.assign(entry, {tone: "failed", msg: e.message, hint: e.hint});
    }
    renderLog();
    load();
  }

  function renderSummary() {
    const s = st.snap;
    if (!s.running) {
      $("rt-shutdown").hidden = true;
      $("rt-meta").innerHTML = `${pill("incomplete", "no runtime")}<span>ROS domain ${esc(s.domain)}</span>`;
      $("rt-stats").innerHTML = "";
      $("rt-banner").className = "banner tone-warn";
      $("rt-banner").textContent = `No runtime answers on ROS domain ${s.domain}. ${s.hint || ""}`;
      return;
    }
    $("rt-shutdown").hidden = false;
    const r = s.state, ls = r.lockstep;
    const holders = r.holders.reduce((a, h) => a + h.count, 0);
    $("rt-meta").innerHTML = `${pill(r.healthy ? "ok" : "failed", r.healthy ? "sim alive" : "sim dead")}${pill(r.paused ? "warn" : "running", r.paused ? "paused" : "running")}${ls.active ? pill("running", ls.paused ? "lockstep paused" : "lockstep") : ""}<span>ROS domain ${esc(s.domain)}</span>${r.params && r.params.sim ? `<span>sim ${esc(r.params.sim)}</span>` : ""}${r.healthy ? "" : `<span class="bad">${esc(r.sim.reason)}</span>`}`;
    $("rt-stats").innerHTML = `
      <div class="stat"><div class="v">${r.envs.ready}<small> / ${r.envs.count}</small></div><div class="k">envs ready</div></div>
      <div class="stat"><div class="v">${s.sim_time == null ? "-" : dur(s.sim_time)}</div><div class="k">sim time</div></div>
      <div class="stat"><div class="v">${ls.active ? (ls.measured_rtf ? ls.measured_rtf.toFixed(2) : "-") : "free"}</div><div class="k">${ls.active ? `lockstep rtf, target ${ls.target_rtf || "max"}` : "lockstep off"}</div></div>
      <div class="stat"><div class="v">${holders}</div><div class="k">pause holds</div></div>`;
    const banner = $("rt-banner");
    banner.className = "banner tone-warn";
    banner.innerHTML = s.benchmark ? `Benchmark run <a href="${BASE}/runs/${encodeURIComponent(s.benchmark)}"><b>${esc(s.benchmark)}</b></a> owns this runtime, the page only watches it.` : "";
  }

  const modesText = (ep) => (ep.modes ? Object.entries(ep.modes).filter(([, v]) => v && v.length).map(([k, v]) => `${k}: ${[].concat(v).join(", ")}`).join("; ") : "");
  const viewButton = (e, off) => ("view" in ((st.options && st.options.actions) || {}) ? envBtn("view", esc(titleCase("view")), e.env_id, "", off) : "");
  const envActions = (e, off) => `${envBtn("reset", esc(titleCase("reset")), e.env_id, "", off)}${envBtn("change", "Change", e.env_id, "", off)}${viewButton(e, off)}${st.snap.viewport ? `<button class="btn sm" data-cam="${e.env_id}" type="button" title="Show a live camera frame of this env">Camera</button>` : ""}${envBtn("despawn", esc(titleCase("despawn")), e.env_id, destructive("despawn") ? " danger" : "", off)}`;

  function renderEnvs() {
    const s = st.snap;
    if (!s.running) { $("rt-envs").innerHTML = `<div class="empty">No runtime.</div>`; $("rt-note").textContent = ""; return; }
    $("rt-note").textContent = `${s.envs.length} env${s.envs.length === 1 ? "" : "s"}`;
    if (!s.envs.length) { $("rt-envs").innerHTML = `<div class="empty">No envs yet, spawn some on the right.</div>`; return; }
    const off = locked() ? " disabled" : "";
    const rows = s.envs.map((e) => {
      const ep = e.episode || {};
      const status = !e.ready ? pill("in_progress", "starting") : ep.resetting ? pill("warn", "resetting") : pill("ok", "ready");
      const outcome = ep.id == null ? `<span class="faint">${esc(ep.error || "none yet")}</span>` : `<span class="mono">#${ep.id}</span> ${pill(ep.outcome === "success" ? "ok" : ep.outcome === "running" ? "running" : ["failed", "fatal"].includes(ep.outcome) ? "failed" : "pending", ep.outcome)}`;
      const elapsed = ep.start_time != null && s.sim_time != null ? dur(s.sim_time - ep.start_time) : "-";
      const modes = modesText(ep);
      return {attrs: `class="clickrow" tabindex="0" data-open="env:${e.env_id}"`, cells: [
        `<span class="chip">env_${e.env_id}</span>`, status, esc((ep.robots || []).join(", ") || "-"), {cls: "muted", h: esc(ep.world || "-")},
        {cls: "muted", h: modes ? `<span class="cut modes" title="${esc(modes)}">${esc(modes)}</span>` : "-"}, outcome, {cls: "num", h: elapsed},
        `<div class="acts">${envActions(e, off)}</div>`,
      ]};
    });
    $("rt-envs").innerHTML = tbl([{h: "Env"}, {h: "Status", p: 3}, {h: "Robot", p: 7}, {h: "World", p: 6}, {h: "Modes", p: 9}, {h: "Episode", p: 5}, {h: "Elapsed", p: 8, cls: "num"}, {h: "", p: 4}], rows, "pinhead");
    fitAll();
  }

  function renderControls() {
    const s = st.snap;
    document.querySelectorAll(".ctlbtn").forEach((b) => { b.disabled = locked(); });
    const submit = document.querySelector("#spawn-form button[type=submit]");
    if (submit) submit.disabled = locked();
    if (!s) return;
    if (!s.running) { $("rt-holds").textContent = ""; $("rt-lockstep").textContent = ""; return; }
    const r = s.state;
    $("rt-holds").textContent = r.holders.length ? `held by ${r.holders.map((h) => `${h.caller_id.split("/").pop()} (${h.reason}${h.count > 1 ? " x" + h.count : ""})`).join(", ")}` : "no holds";
    const ls = r.lockstep;
    $("rt-lockstep").textContent = ls.active ? `lockstep ${ls.paused ? "paused" : "running"}${ls.ungated ? ", ungated" : ""}, tick ${ls.tick.toFixed(2)} s, ${ls.gated_ticks} gated ticks${ls.waiting_on && ls.waiting_on.length ? `, waiting on ${ls.waiting_on.join(", ")}` : ""}` : "lockstep off, the sim free-runs unless held";
  }

  function applyTips() {
    document.querySelectorAll("[data-act]").forEach((b) => { if (b.dataset.act in ((st.options || {}).actions || {})) { b.title = doc(b.dataset.act); b.classList.toggle("danger", destructive(b.dataset.act)); } });
  }

  function renderSim() {
    const acts = (st.options && st.options.actions) || {};
    while (st.simDisp.length) st.simDisp.pop()();
    const groups = [];
    for (const key of Object.keys(acts)) {
      if (PLACED.includes(key) || acts[key].scope !== "runtime") continue;
      const i = key.lastIndexOf("_");
      const g = i < 0 ? key : key.slice(0, i);
      let grp = groups.find((x) => x[0] === g);
      if (!grp) { grp = [g, []]; groups.push(grp); }
      grp[1].push(key);
    }
    $("rt-sim").innerHTML = groups.map(([g, keys]) => `<div class="ctl"><span class="lbl">${esc(human(g))}</span>${keys.map((k) => `${(acts[k].params || []).map((p) => paramHtml(p, k, `sim-${slug(k)}-${slug(p.name)}`)).join("")}<button class="btn ctlbtn${destructive(k) ? " danger" : ""}" type="button" data-act="${esc(k)}" title="${esc(acts[k].doc)}">${esc(titleCase(k.slice(k.lastIndexOf("_") + 1)))}</button>`).join("")}</div>`).join("") || `<div class="empty">The runtime declares no simulation controls.</div>`;
    for (const k of Object.keys(acts)) if (acts[k].params) bindEnums($("rt-sim"), acts[k].params.filter((p) => $("rt-sim").querySelector(`[data-for="${k}"][data-ap="${CSS.escape(p.name)}"]`)), st.simDisp);
    renderControls();
  }

  function renderSpawn() {
    const o = st.options;
    if (st.form) { st.form.dispose(); st.form = null; }
    const axes = Object.keys(o.task_modes || {});
    const fields = o.spawn_fields || [];
    if (st.spawnStop) st.spawnStop();
    $("rt-spawn").innerHTML = `<form id="spawn-form" class="form">
      ${fields.map((f) => `<label for="sp-${esc(slug(f.name))}" title="${esc(f.description || "")}">${esc(human(f.name.slice(f.name.lastIndexOf(".") + 1)))}</label><input id="sp-${esc(slug(f.name))}" class="combo" data-sf="${esc(f.name)}" title="${esc(f.description || "")}" placeholder="pick or type">`).join("")}
      ${axes.length ? `<label>Task</label><div id="sp-task"></div>` : ""}
      <label for="sp-count">Count</label><input id="sp-count" name="count" type="number" value="1" min="1" max="16">
      <label for="sp-arg">More args</label><div class="stack"><input id="sp-arg" class="combo" placeholder="key:=value"><textarea id="sp-extra" name="extra" rows="2" placeholder="key:=value, one per line"></textarea></div>
      <span></span><div class="ctl" style="padding:0"><button class="btn primary" type="submit" title="${esc(doc("spawn"))}">${esc(titleCase("spawn"))}</button></div>
    </form>`;
    const inputOf = (name) => $("spawn-form").querySelector(`[data-sf="${CSS.escape(name)}"]`);
    const worldEl = inputOf("world");
    const live = [], stops = [];
    for (const f of fields) {
      const el = inputOf(f.name);
      if (f.items) stops.push(bindCombo(el, f.items, () => el.dispatchEvent(new Event("change"))));
      else if (f.catalog) { const lc = liveCombo(el, f.catalog, worldEl, () => el.dispatchEvent(new Event("change")), `pick or type ${f.catalog}`); live.push({lc, el}); stops.push(lc.stop); }
    }
    let timer = 0;
    const onWorld = () => { clearTimeout(timer); timer = setTimeout(() => live.forEach((x) => { if (x.el !== worldEl) x.lc.refill(); }), 250); };
    if (worldEl) { worldEl.addEventListener("input", onWorld); worldEl.addEventListener("change", onWorld); }
    st.spawnStop = () => { clearTimeout(timer); stops.forEach((d) => d()); if (worldEl) { worldEl.removeEventListener("input", onWorld); worldEl.removeEventListener("change", onWorld); } };
    if (axes.length) st.form = taskForm($("sp-task"), o, {}, worldEl);
    const addArg = (name) => {
      const extra = $("sp-extra");
      const key = name.trim().replace(/:=.*$/, "");
      if (!key) return;
      if (!extra.value.split("\n").some((line) => line.trim().startsWith(`${key}:=`))) extra.value = `${extra.value.trimEnd()}${extra.value.trim() ? "\n" : ""}${key}:=`;
      $("sp-arg").value = "";
      extra.focus();
      extra.setSelectionRange(extra.value.length, extra.value.length);
    };
    bindCombo($("sp-arg"), o.launch_args || [], addArg);
    $("sp-arg").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); addArg($("sp-arg").value); } });
    $("spawn-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const args = {};
      for (const line of String(f.get("extra")).split("\n")) {
        const at = line.indexOf(":=");
        if (at > 0) args[line.slice(0, at).trim()] = line.slice(at + 2).trim();
      }
      for (const field of fields) if (inputOf(field.name).value.trim()) args[field.name] = inputOf(field.name).value.trim();
      const body = {launch_args: args, count: Number(f.get("count")) || 1};
      if (st.form) {
        const t = st.form.read();
        if (Object.keys(t.modes).length) body.modes = t.modes;
        if (Object.keys(t.params).length) body.params = t.params;
      }
      act("spawn", null, body);
    });
    applyTips();
    renderControls();
  }

  function showCamera(envId) {
    st.cam = envId;
    $("cam-box").hidden = false;
    $("cam-note").textContent = `env_${envId}, refreshes every 4 s`;
    const img = $("cam-img");
    img.onerror = () => { $("cam-note").textContent = `env_${envId}: no frame, the viewport did not answer`; };
    const refresh = () => { if (st.cam === envId) img.src = `${BASE}/api/runtime/envs/${envId}/camera.png?t=${Date.now()}`; };
    clearInterval(st.camTimer);
    refresh();
    st.camTimer = setInterval(refresh, 4000);
  }
  $("rt-shutdown").addEventListener("click", async () => {
    if (!(await ask({title: "Stop the runtime", html: "<p>Stops the runtime and every env in it. This dashboard stays up: start the runtime again from the Targets page.</p>", ok: "Stop Runtime", danger: true}))) return;
    try { await post(ROOT + "/api/runtime/shutdown", {}); conn("runtime stopped", "on"); } catch (e) { conn(`${e.message}${e.hint ? ", " + e.hint : ""}`, "bad"); }
    load();
  });
  $("cam-close").addEventListener("click", () => { st.cam = null; clearInterval(st.camTimer); $("cam-box").hidden = true; });

  async function fetchTask(id, epId) {
    const have = st.tasks[id];
    if (have && have.ep === epId) return;
    st.tasks[id] = {ep: epId, data: have ? have.data : null};
    try { st.tasks[id] = {ep: epId, data: await api(`/api/runtime/envs/${id}/task`)}; } catch (e) { st.tasks[id] = {ep: epId, data: null, error: e.message}; }
    router.render();
  }
  const router = detailRouter((key) => {
    const m = key.match(/^env:(\d+)$/);
    const e = m ? envOf(Number(m[1])) : null;
    if (!e) return null;
    fetchTask(e.env_id, e.episode ? e.episode.id : null);
    const t = st.tasks[e.env_id];
    const task = {};
    const tips = {};
    if (t && t.data) {
      task.modes = t.data.modes;
      task.params = {};
      const known = {};
      for (const ax of Object.values((st.options || {}).task_modes || {})) for (const m of Object.values(ax.modes)) for (const p of m.params) known[p.name] = p;
      for (const [name, v] of Object.entries(t.data.params)) {
        const parts = name.split(".");
        if (parts[0] === "task" && parts.length > 1) parts.shift();
        let node = task.params;
        parts.slice(0, -1).forEach((seg) => { if (node[seg] !== undefined && isScalar(node[seg])) node[seg] = {value: node[seg]}; node = node[seg] = node[seg] || {}; });
        const last = parts[parts.length - 1];
        if (node[last] !== undefined && !isScalar(node[last])) node[last].value = v; else node[last] = v;
        if (known[name]) tips[`task.params.${parts.join(".")}`] = [known[name].label || known[name].leaf, known[name].description].filter(Boolean).join(": ");
      }
    } else task.status = t && t.error ? t.error : "loading";
    const off = locked() ? " disabled" : "";
    return {title: `<span class="chip">env_${e.env_id}</span>`, fields: {...omit(e, "env_id"), task}, tips, actions: envActions(e, off)};
  });

  async function viewEnv(envId) {
    const w = window.open("about:blank", "_blank");
    if (!w) { conn("the browser blocked the new tab, allow pop-ups for this page", "bad"); return; }
    const entry = {t: new Date().toLocaleTimeString(), what: `view env ${envId}`, tone: "in_progress"};
    logEntry(entry);
    try {
      const got = (await post(`/api/runtime/envs/${envId}/view`, {})).result;
      w.location = got.url;
      Object.assign(entry, {tone: "ok", msg: got.url});
    } catch (e) {
      w.close();
      Object.assign(entry, {tone: "failed", msg: e.message, hint: e.hint});
      conn(`${e.message}${e.hint ? ", " + e.hint : ""}`, "bad");
    }
    renderLog();
    load();
  }

  async function change(envId) {
    const o = st.options || (await loadOptions()) || {};
    let current = {modes: {}, params: {}};
    try { current = await api(`/api/runtime/envs/${envId}/task`); } catch (e) { conn(e.message, "bad"); }
    let form = null;
    const rp = actionDecl("reset").params || [];
    const r = await ask({
      title: `Change env ${envId}`,
      ok: titleCase("reset"),
      tip: doc("reset"),
      wide: true,
      html: `<p>${esc(doc("reset"))}</p>${rp.map((p) => paramHtml(p, "reset", `dl-p-${slug(p.name)}`, true)).join("")}
        <div class="dlg-field"><label>Task</label><div id="dl-task"></div></div>`,
      setup: (disposers) => {
        bindEnums($("ui-body"), rp, disposers);
        const worldEl = $("dl-p-world");
        for (const p of rp) {
          const f = (o.spawn_fields || []).find((x) => x.name === p.name);
          const el = $(`dl-p-${slug(p.name)}`);
          if (!f || !el) continue;
          if (f.items) disposers.push(bindCombo(el, f.items, () => el.dispatchEvent(new Event("change"))));
          else if (f.catalog) disposers.push(liveCombo(el, f.catalog, worldEl, () => el.dispatchEvent(new Event("change")), `pick or type ${f.catalog}`).stop);
        }
        form = taskForm($("dl-task"), o, current, worldEl);
        disposers.push(() => form.dispose());
      },
      read: () => {
        const got = readParams($("ui-body"), "reset", rp);
        if (got.error) { conn(got.error, "bad"); return null; }
        const body = got.body;
        const t = form.read();
        if (Object.keys(t.modes).length) body.modes = t.modes;
        if (Object.keys(t.params).length) body.params = t.params;
        return body;
      },
    });
    if (r) act("reset", envId, r);
  }

  $("main").addEventListener("click", (ev) => {
    const cam = ev.target.closest("[data-cam]");
    if (cam) { router.close(); showCamera(Number(cam.dataset.cam)); return; }
    const b = ev.target.closest("button[data-act]");
    if (!b || b.disabled) return;
    const envId = b.dataset.env != null ? Number(b.dataset.env) : null;
    const a = b.dataset.act;
    if (a === "change") { change(envId); return; }
    if (a === "view") { viewEnv(envId); return; }
    const got = readParams($("main"), a, actionDecl(a).params || []);
    if (got.error) { conn(got.error, "bad"); return; }
    act(a, envId, got.body, destructive(a) ? `${human(a)}${envId != null ? ` env ${envId}` : ""}?` : "", titleCase(a));
  });
  clickRows($("rt-envs"), (row) => router.open(row.dataset.open));

  function apply(snap, at) {
    st.snap = snap;
    st.offset = snap.now - at / 1000;
    renderSummary(); renderEnvs(); renderControls();
    router.render();
    if (!snap.viewport && st.cam != null) $("cam-close").click();
  }
  async function load() {
    if (st.busy) return;
    st.busy = true;
    try {
      const snap = await api(ROOT + "/api/runtime");
      apply(snap, Date.now());
      conn(`live, updated ${new Date().toLocaleTimeString()}${snap.age_s > 5 ? `, snapshot ${dur(snap.age_s)} old` : ""}`, snap.running ? "on" : "");
    } catch (e) { conn(e.message, "bad"); }
    finally { st.busy = false; }
  }
  const cachedSnap = stash.get("/api/runtime");
  if (cachedSnap) { apply(cachedSnap.d, cachedSnap.t); cachedNote(cachedSnap); }
  if (st.options) { renderSim(); renderSpawn(); }
  applyTips();
  load();
  setInterval(load, 1500);
  api(ROOT + "/api/runtime/options").then((o) => {
    const changed = !same(st.options, o);
    OPT = o;
    st.options = o;
    if (changed) { renderSim(); renderSpawn(); } else applyTips();
  }).catch((e) => { if (!st.options) { $("rt-spawn").innerHTML = `<div class="empty">${esc(e.message)}</div>`; $("rt-sim").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } });
}

function targetsPage() {
  document.body.classList.add("run");
  document.title = "Arena";
  const st = {data: null, busy: false, pending: new Map()};
  $("main").innerHTML = `
    <section class="summary"><div class="sum-top"><div class="hero"><h1>Targets</h1><div class="meta" id="tg-actions"></div></div><div id="tg-stats" class="stats"></div></div></section>
    <div class="cols wide">
      <div class="col">
        <section class="grow"><h2>Runtimes</h2><div id="tg-list" class="body scroll">${loading("Looking for containers")}</div></section>
      </div>
      <div class="col">
        <section class="fit"><h2>New fork</h2><div class="body"><form id="fork-form" class="form">
          <label for="fk-name">Name</label><input id="fk-name" name="name" placeholder="name" pattern="[a-z0-9][a-z0-9-]*" required>
          <span></span><div class="ctl" style="padding:0"><button class="btn primary" type="submit" id="fk-go" title="Create a fork">New Fork</button><span id="fk-status"></span></div>
        </form></div></section>
        <section class="grow"><h2>Activity</h2><div class="body"><ul class="activity" id="tg-activity"><div class="empty">Hub actions show up here with their output.</div></ul></div></section>
      </div>
    </div>`;

  const hubAct = (a) => (st.data && st.data.actions ? st.data.actions[a] : undefined);
  const hubLabel = (a, fallback) => (hubAct(a) ? hubAct(a).label : fallback);
  const hubTip = (a, fallback) => (hubAct(a) ? hubAct(a).doc : fallback);
  const hubBtn = (a, fallback, cls, attrs) => `<button class="btn sm ${cls}" data-hub="${a}" title="${esc(hubTip(a, fallback))}" ${attrs}>${esc(hubLabel(a, fallback))}</button>`;

  function runtimeCell(t) {
    const rt = t.runtime;
    if (st.pending.has(t.id)) return working(st.pending.get(t.id));
    if (st.data.busy.includes(t.id)) return working("working, see Activity");
    if (t.dashboard.state === "starting") return working("connecting");
    if (t.dashboard.state === "failed") return `<span class="cut bad" title="${esc(t.dashboard.error)}">${esc(t.dashboard.error)}</span>`;
    if (t.dashboard.state !== "up") return `<span class="faint">${esc(t.container === "running" ? "not connected" : "container " + t.container)}</span>`;
    if (!rt || !rt.running) return pill("incomplete", "no runtime");
    const s = rt.state;
    return [pill(s.healthy ? "ok" : "failed", s.healthy ? (s.params && s.params.sim) || "up" : "sim dead"), `<span>${s.envs.ready}/${s.envs.count} envs</span>`, s.paused ? pill("warn", "paused") : "", s.lockstep.active ? pill("running", "lockstep") : "", rt.benchmark ? pill("running", "benchmark") : ""].join(" ");
  }

  function render() {
    const d = st.data;
    const up = d.targets.filter((t) => t.runtime && t.runtime.running);
    const dev = d.targets.find((t) => t.kind === "dev");
    $("tg-actions").innerHTML = dev ? `<a class="btn sm" href="${at(dev.url)}/" data-goto="/" data-target="${esc(dev.id)}" title="Benchmark runs of this machine">Benchmarks</a>` : "";
    $("tg-stats").innerHTML = `
      <div class="stat"><div class="v">${d.targets.length}</div><div class="k">containers</div></div>
      <div class="stat"><div class="v">${up.length}</div><div class="k">runtimes up</div></div>
      <div class="stat"><div class="v">${up.reduce((a, t) => a + t.runtime.state.envs.count, 0)}</div><div class="k">envs</div></div>
      <div class="stat"><div class="v">${d.targets.filter((t) => t.kind === "fork").length}</div><div class="k">forks</div></div>`;
    const creating = d.busy.filter((key) => key.endsWith(":fork-new"));
    $("fk-status").innerHTML = st.pending.has("fork-new") ? working(st.pending.get("fork-new")) : creating.length ? working("creating a fork") : hubAct("fork_new") ? `<span class="note">${esc(hubAct("fork_new").doc)}</span>` : "";
    $("fk-go").disabled = st.pending.has("fork-new") || creating.length > 0;
    $("fk-go").title = hubTip("fork_new", "Create a fork");
    $("fk-go").textContent = hubLabel("fork_new", "New Fork");
    if (!d.targets.length) { $("tg-list").innerHTML = `<div class="empty">No arena containers found${d.errors.length ? ": " + esc(d.errors.join("; ")) : ""}.</div>`; return; }
    const rank = (t) => (t.kind === "dev" ? 0 : 1) * 10 + (t.runtime && t.runtime.running ? 0 : t.dashboard.state === "up" ? 1 : t.container === "running" ? 2 : 3);
    const row = (t) => {
      const open = t.dashboard.state === "up";
      const rtUp = open && t.runtime && t.runtime.running;
      const running = t.container === "running";
      const busy = d.busy.includes(t.id) || st.pending.has(t.id) ? " disabled" : "";
      const target = `data-target="${esc(t.id)}"`;
      const acts = [
        t.kind === "fork" ? hubBtn("fork_down", "Delete Fork", "ghost", `${target} data-name="${esc(t.name)}"${busy}`) : "",
      ].join("");
      const clickable = running && t.dashboard.state !== "failed";
      return `<div class="trow${clickable ? " clickrow" : ""}"${clickable ? ` tabindex="0" data-open="${esc(t.id)}" title="Open the runtime page of ${esc(t.id)}"` : ""}>
        <div class="tname"><b>${esc(t.name)}</b><span class="tag">${esc(t.kind)}</span></div>
        <div class="tstate">${runtimeCell(t)}</div>
        <div class="tacts">${acts}</div></div>`;
    };
    const rows = d.targets.slice().sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)).map(row).join("");
    $("tg-list").innerHTML = `<div class="tlist">${rows}</div>${d.errors.length ? `<div class="banner tone-warn" style="margin-top:12px">${esc(d.errors.join("; "))}</div>` : ""}`;
  }

  function renderActivity(items) {
    if (!items.length) return;
    $("tg-activity").innerHTML = items.map((x) => `<li><span class="t">${esc(x.t)}</span><span class="what">${x.state === "running" ? working(`running ${dur(Date.now() / 1000 - x.started)}`) : pill(x.state === "done" ? "ok" : "failed", x.state)}<b>${esc(x.what)}</b></span>${x.output ? `<span class="msg" title="${esc(x.output)}">${esc(x.output.split("\n").filter((l) => l.trim()).slice(-2).join("\n"))}</span>` : ""}</li>`).join("");
  }

  async function hub(path, body, key, text) {
    st.pending.set(key, text);
    if (st.data) render();
    try { await post(path, body); } catch (e) { conn(e.message, "bad"); }
    st.pending.delete(key);
    load();
  }

  async function connect(id) {
    const t = st.data.targets.find((x) => x.id === id);
    if (!t || t.dashboard.state === "up") return t;
    st.pending.set(id, "connecting, starts the container's dashboard");
    render();
    try { await post(`/hub/targets/${tpath(id)}/connect`, {}); } catch (e) { st.pending.delete(id); conn(e.message, "bad"); load(); return null; }
    return st.data.targets.find((x) => x.id === id);
  }

  async function startRuntime(id) {
    const t = await connect(id);
    if (!t) return;
    const o = await fetch(`${at(t.url)}/api/runtime/options`, {cache: "no-store"}).then((r) => r.json()).catch(() => ({}));
    const r = await ask({
      title: `Start a runtime in ${id}`,
      ok: hubLabel("runtime_up", "Start Runtime"),
      tip: hubTip("runtime_up", "Start a runtime"),
      html: `<div class="dlg-field"><label for="dl-sim">Simulator</label><input id="dl-sim" class="combo" placeholder="default"></div>
        <div class="dlg-field"><label for="dl-args">More args</label><input id="dl-args" placeholder="key:=value ..., space separated"></div>`,
      setup: (disposers) => disposers.push(bindCombo($("dl-sim"), o.sims || [])),
      read: () => ({sim: $("dl-sim").value.trim(), args: $("dl-args").value.trim()}),
    });
    if (!r) return;
    st.pending.set(id, "starting a runtime");
    render();
    try { await post(`/hub/targets/${tpath(id)}/runtime_up`, r); } catch (e) { st.pending.delete(id); conn(`${e.message}${e.hint ? ", " + e.hint : ""}`, "bad"); load(); return; }
    st.pending.delete(id);
    const deadline = Date.now() + 120000;
    while (Date.now() < deadline) {
      const fresh = await api(ROOT + "/hub/targets").catch(() => null);
      const now = fresh && fresh.targets.find((x) => x.id === id);
      if (now && now.runtime && now.runtime.running) break;
      await new Promise((ok) => setTimeout(ok, 1000));
    }
    location.href = `${at(t.url)}/runtime`;
  }

  clickRows($("tg-list"), async (row) => {
    const t = st.data.targets.find((x) => x.id === row.dataset.open);
    if (!t) return;
    if (!(t.runtime && t.runtime.running)) { await startRuntime(t.id); return; }
    const ready = await connect(t.id);
    if (ready) location.href = `${ready.url}/runtime`;
  });
  const follow = async (ev) => {
    const a = ev.target.closest("a[data-goto]");
    if (!a) return false;
    const t = st.data.targets.find((x) => x.id === a.dataset.target);
    if (!t || t.dashboard.state === "up") return false;
    ev.preventDefault();
    st.pending.set(t.id, "connecting, starts the container's dashboard");
    render();
    try { await post(`/hub/targets/${tpath(t.id)}/connect`, {}); } catch (e) { st.pending.delete(t.id); conn(e.message, "bad"); load(); return true; }
    location.href = at(t.url) + a.dataset.goto;
    return true;
  };
  $("tg-actions").addEventListener("click", follow);
  $("tg-list").addEventListener("click", async (ev) => {
    if (await follow(ev)) return;
    const b = ev.target.closest("button[data-hub]");
    if (!b || b.disabled) return;
    const id = b.dataset.target, action = b.dataset.hub;
    const url = `/hub/targets/${tpath(id)}/${action}`;
    if (action === "fork_down") {
      const name = b.dataset.name;
      ask({
        title: `Delete fork ${name}`,
        ok: hubLabel("fork_down", "Delete Fork"),
        tip: hubTip("fork_down", "Delete this fork"),
        danger: true,
        html: `<p>${esc(hubAct("fork_down") ? hubAct("fork_down").doc : "Deletes this fork and every edit in it.")}</p><div class="dlg-field"><label for="dl-name">Type <b>${esc(name)}</b> to confirm</label><input id="dl-name" autocomplete="off"></div>`,
        setup: (disposers, okb) => { okb.disabled = true; $("dl-name").addEventListener("input", () => { okb.disabled = $("dl-name").value !== name; }); },
      }).then((r) => { if (r) hub(url, {confirm: name}, id, "deleting fork"); });
      return;
    }
    if (action === "runtime_down") {
      ask({title: `Stop the runtime in ${id}`, html: `<p>${esc(hubAct("runtime_down") ? hubAct("runtime_down").doc : "Stops the runtime and every env in it.")}</p>`, ok: hubLabel("runtime_down", "Stop Runtime"), tip: hubTip("runtime_down", "Stop the runtime"), danger: true}).then((r) => { if (r) hub(url, {}, id, "stopping runtime"); });
      return;
    }
    if (action === "runtime_up") {
      fetch(`/t/${encodeURIComponent(id)}/api/runtime/options`, {cache: "no-store"}).then((r) => r.json()).catch(() => ({})).then((o) => ask({
        title: `Start a runtime in ${id}`,
        ok: hubLabel("runtime_up", "Start Runtime"),
        tip: hubTip("runtime_up", "Start a runtime"),
        html: `<div class="dlg-field"><label for="dl-sim">Simulator</label><input id="dl-sim" class="combo" placeholder="default"></div>
          <div class="dlg-field"><label for="dl-args">More args</label><input id="dl-args" placeholder="key:=value ..., space separated"></div>`,
        setup: (disposers) => disposers.push(bindCombo($("dl-sim"), o.sims || [])),
        read: () => ({sim: $("dl-sim").value.trim(), args: $("dl-args").value.trim()}),
      })).then((r) => { if (r) hub(url, r, id, "starting runtime"); });
      return;
    }
    hub(url, {}, id, action === "connect" ? "connecting, starts the container's dashboard" : "working");
  });
  $("fork-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    hub("/hub/fork_new", {name: String(f.get("name")).trim()}, "fork-new", `creating ${String(f.get("name")).trim()}`);
  });

  async function load() {
    if (st.busy) return;
    st.busy = true;
    try {
      const [data, activity] = await Promise.all([api(ROOT + "/hub/targets"), api(ROOT + "/hub/activity")]);
      st.data = data;
      render();
      renderActivity(activity.items);
      conn(`live, updated ${new Date().toLocaleTimeString()}`, "on");
    } catch (e) { conn(e.message, "bad"); }
    finally { st.busy = false; }
  }
  const cachedTargets = stash.get("/hub/targets"), cachedActivity = stash.get("/hub/activity");
  if (cachedTargets) {
    st.data = cachedTargets.d;
    render();
    if (cachedActivity) renderActivity(cachedActivity.d.items);
    cachedNote(cachedTargets);
  }
  load();
  setInterval(load, 1000);
}

const match = PATH.match(/^\/runs\/([^/]+)/);
if (HUB && !BASE) { nav("targets"); targetsPage(); }
else if (PATH.startsWith("/runtime")) { nav("runtime"); runtimePage(); }
else if (match) { nav("runs"); runPage(decodeURIComponent(match[1])); }
else { nav("runs"); listPage(); }
</script>
</body>
</html>
