# Planner set for the animation paper (EVALUATION.md "Episode budget"), revised 2026-09-11:
# three costmap planners plus one learned planner. HATEB is excluded, AttnGraph replaces DRL-VO.
# Study B (narrow-passage pointing) uses the costmap subset only (dwb, mppi, graceful): contests/paper_costmap_planners.yaml
# navigate_to_pose_w_replanning_and_recovery: with pedestrians visible, a pair on the path makes the controller
# report a collision; navigate_w_replanning_time then fails the goal for good and the robot parks until timeout.
# social_cost_layer: arena_social_cost_layer in the local costmap (reads arena_peds), on for every costmap
# planner (decision 2026-09-12). AttnGraph runs through the drl adapter, no nav2 costmap.
name: paper_planners
contestants:
- name: dwb
  mobile:
    driver: nav2
    local_planner: dwb
    inter_planner: navigate_to_pose_w_replanning_and_recovery
    social_cost_layer: true
- name: mppi
  mobile:
    driver: nav2
    local_planner: mppi
    inter_planner: navigate_to_pose_w_replanning_and_recovery
    social_cost_layer: true
- name: graceful
  mobile:
    driver: nav2
    local_planner: graceful
    inter_planner: navigate_to_pose_w_replanning_and_recovery
    social_cost_layer: true
- name: attngraph
  mobile: drl
  mobile.planner: attngraph
