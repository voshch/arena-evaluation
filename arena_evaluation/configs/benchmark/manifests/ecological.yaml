# Ecological focus: energy consumption, power dissipation, transport costs (S-CoT/E-CoT), friction losses, and acoustic footprint.
manifest_version: "1.0"
name: ecological
title: Ecological & Energetic Impact Report
description: Comprehensive energy consumption, power dissipation, transport costs (S-CoT/E-CoT), friction losses, and acoustic emissions across navigation planners.
data_source: metrics
groups:
  - {id: overview, title: Ecological Performance Overview}
  - {id: energy_consumption, title: Electrical Energy & Power Consumption}
  - {id: transport_efficiency, title: Cost of Transport & Compliance Overheads}
  - {id: dynamic_dissipation, title: Kinetic Energy Variations & Friction Losses}
  - {id: acoustic_impact, title: Environmental Acoustic Emissions & Footprint}
  - {id: power_dynamics, title: Power Draw & Velocity Time Profiles}
  - {id: eco_tradeoffs, title: Ecological & Transport Trade-Off Frontiers}
units:
  energy_total_wh: Wh
  energy_static_wh: Wh
  energy_mechanical_wh: Wh
  energy_thermal_wh: Wh
  specific_cost_of_transport: ""
  e_cot: ""
  kcsc_wh: Wh
  kinetic_energy_demand_j: J
  friction_dissipation_j: J
  power_peak_w: W
  battery_soc_drop_pct: "%"
  relative_throughput: ""
  time_to_goal: s
  path_length: m
  path_efficiency: ""
  success: "%"
  spl: ""
  aeps_linear_s: s
  ped_max_exposure_dba: dBA
  ped_leq_exposure_dba: dBA
  ped_max_startle_factor: dBA/s
  total_sound_energy_joules: J
  total_acoustic_work_joules: J
  timeseries_power_total_w: W
  timeseries_power_static_w: W
  timeseries_power_mechanical_w: W
  timeseries_power_thermal_w: W
  timeseries_battery_soc: "%"
  timeseries_time_s: s
  timeseries_velocity_linear: m/s
plots:
  # ── Overview ────────────────────────────────────────────────────────────────
  - id: eco_summary_table
    type: table
    title: Ecological & Transport Executive Summary
    data_key: "*"
    layout_group: overview
    options:
      group_by: [local_planner]
      columns:
        - {metric: energy_total_wh, label: Total Energy (Wh), format: "{:.2f}"}
        - {metric: specific_cost_of_transport, label: S-CoT, format: "{:.2f}"}
        - {metric: e_cot, label: E-CoT, format: "{:.2f}"}
        - {metric: kcsc_wh, label: KCSC (Wh), format: "{:.2f}"}
        - {metric: kinetic_energy_demand_j, label: Kinetic Demand (J), format: "{:.1f}"}
        - {metric: friction_dissipation_j, label: Friction Work (J), format: "{:.1f}"}
        - {metric: ped_leq_exposure_dba, label: Leq Noise (dBA), format: "{:.1f}"}
  - id: radar_ecological
    type: radar
    title: Multi-Axis Ecological & Energetic Profile
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: overview
    options:
      metrics: [energy_total_wh, specific_cost_of_transport, e_cot, kcsc_wh, kinetic_energy_demand_j, ped_leq_exposure_dba, spl]

  # ── Electrical Energy & Power Consumption ───────────────────────────────────
  - id: bar_energy_breakdown
    type: bar
    title: Energy Breakdown by Subsystem (%)
    data_key: energy_total_wh
    differentiate: local_planner
    layout_group: energy_consumption
    options:
      stacked: true
      metrics: [energy_static_wh, energy_mechanical_wh, energy_thermal_wh]
  - id: violin_energy_local
    type: violin
    title: Total Energy Consumption (Wh) by Local Planner
    data_key: energy_total_wh
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_consumption
  - id: violin_energy_inter
    type: violin
    title: Total Energy Consumption (Wh) by Inter-Planner
    data_key: energy_total_wh
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: energy_consumption
  - id: box_battery_drop_local
    type: box
    title: Battery State-of-Charge Drop (%) by Local Planner
    data_key: battery_soc_drop_pct
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_consumption
  - id: box_power_peak_local
    type: box
    title: Peak Electrical Power Draw (W) by Local Planner
    data_key: power_peak_w
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_consumption

  # ── Cost of Transport & Compliance Overheads ────────────────────────────────
  - id: violin_scot_local
    type: violin
    title: Specific Cost of Transport (S-CoT) by Local Planner
    data_key: specific_cost_of_transport
    differentiate: local_planner
    auto_differentiate: false
    layout_group: transport_efficiency
  - id: violin_scot_inter
    type: violin
    title: Specific Cost of Transport (S-CoT) by Inter-Planner
    data_key: specific_cost_of_transport
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: transport_efficiency
  - id: box_ecot_local
    type: box
    title: Effective Cost of Transport (E-CoT) by Local Planner
    data_key: e_cot
    differentiate: local_planner
    auto_differentiate: false
    layout_group: transport_efficiency
  - id: box_kcsc_local
    type: box
    title: Kinematic Cost of Social Compliance (KCSC in Wh) by Local Planner
    data_key: kcsc_wh
    differentiate: local_planner
    auto_differentiate: false
    layout_group: transport_efficiency
  - id: box_relative_throughput_local
    type: box
    title: Relative Throughput (vs Unobstructed) by Local Planner
    data_key: relative_throughput
    differentiate: local_planner
    auto_differentiate: false
    layout_group: transport_efficiency

  # ── Dynamic Variations & Friction Losses ────────────────────────────────────
  - id: box_kinetic_energy_demand_local
    type: box
    title: Kinetic Energy Demand Variation (J) by Local Planner
    data_key: kinetic_energy_demand_j
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation
  - id: box_kinetic_energy_demand_inter
    type: box
    title: Kinetic Energy Demand Variation (J) by Inter-Planner
    data_key: kinetic_energy_demand_j
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation
  - id: box_friction_dissipation_local
    type: box
    title: Rolling Friction Dissipation Work (J) by Local Planner
    data_key: friction_dissipation_j
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation
  - id: box_friction_dissipation_inter
    type: box
    title: Rolling Friction Dissipation Work (J) by Inter-Planner
    data_key: friction_dissipation_j
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation

  # ── Environmental Acoustic Emissions ────────────────────────────────────────
  - id: box_acoustic_leq
    type: box
    title: Equivalent Sound Level at Pedestrians L_Aeq (dBA) by Local Planner
    data_key: ped_leq_exposure_dba
    differentiate: local_planner
    layout_group: acoustic_impact
  - id: box_acoustic_max
    type: box
    title: Peak Sound Level at Pedestrians L_AFmax (dBA) by Local Planner
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    layout_group: acoustic_impact
  - id: box_acoustic_startle
    type: box
    title: Max Pedestrian Startle Factor (dBA/s) by Local Planner
    data_key: ped_max_startle_factor
    differentiate: local_planner
    layout_group: acoustic_impact
  - id: box_sound_energy_local
    type: box
    title: Total Acoustic Radiated Energy (Joules) by Local Planner
    data_key: total_sound_energy_joules
    differentiate: local_planner
    auto_differentiate: false
    layout_group: acoustic_impact
  - id: acoustic_field_worst_case
    type: acoustic_field
    title: "Spatial Acoustic Field (Worst-Case Frame)"
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    group_by: [stage]
    layout_group: acoustic_impact
    options:
      downsample: 1
      overlay_trajectories: true
  - id: acoustic_field_animation
    type: acoustic_field_animation
    title: "Acoustic Field Timeline (Animated)"
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    group_by: [stage]
    layout_group: acoustic_impact
    options:
      downsample: 2
      fps: 10
      max_frames: 100
      overlay_trajectories: true
      format: gif

  # ── Power & Velocity Time Profiles ──────────────────────────────────────────
  - id: timeseries_power
    type: timeseries
    title: Power Breakdown & Battery Over Time
    data_key: timeseries_power_total_w
    differentiate: local_planner
    layout_group: power_dynamics
    group_by: [stage]
    options:
      x: timeseries_time_s
      metrics: [timeseries_power_total_w, timeseries_power_static_w, timeseries_power_mechanical_w, timeseries_power_thermal_w, timeseries_battery_soc]
  - id: timeseries_velocity
    type: timeseries
    title: Velocity Profile Over Time
    data_key: timeseries_velocity_linear
    differentiate: local_planner
    layout_group: power_dynamics
    group_by: [stage]
    options: {x: timeseries_time_s}

  # ── Ecological Trade-Off Frontiers ──────────────────────────────────────────
  - id: scatter_energy_vs_time
    type: scatter
    title: Energy vs. Time Trade-Off (Total Energy vs. Time to Goal)
    data_key: time_to_goal
    differentiate: local_planner
    layout_group: eco_tradeoffs
    options: {y: energy_total_wh}
  - id: scatter_scot_vs_spl
    type: scatter
    title: Transport Cost vs. Navigation Performance (S-CoT vs. SPL)
    data_key: spl
    differentiate: local_planner
    layout_group: eco_tradeoffs
    options: {y: specific_cost_of_transport}
  - id: scatter_ke_vs_velocity
    type: scatter
    title: Dynamic Agility vs. Steady Speed (Kinetic Demand vs. Mean Velocity)
    data_key: velocity_mean
    differentiate: local_planner
    layout_group: eco_tradeoffs
    options: {y: kinetic_energy_demand_j}
  - id: scatter_ecot_vs_kcsc
    type: scatter
    title: Effective Transport Cost vs. Social Compliance Overhead (E-CoT vs. KCSC)
    data_key: kcsc_wh
    differentiate: local_planner
    layout_group: eco_tradeoffs
    options: {y: e_cot}

