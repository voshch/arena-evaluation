# ==============================================================================
# EVERYTHING MANIFEST: Comprehensive Master Evaluation Report & MCP Agent Catalog
# ==============================================================================
# Overloaded exhaustive evaluation report containing every metric, chart combination,
# distribution (box/violin), correlation matrix, pivot grid, spatial trace, and
# multi-objective trade-off frontier across all evaluation domains.
# Serves as the ultimate showcase and inspiration for researchers and MCP agents.
# ==============================================================================

manifest_version: "1.0"
name: everything
title: Comprehensive Master Evaluation Report (All Metrics & Perspectives)
description: Exhaustive master report containing every metric, visualization type, correlation, and trade-off frontier across all evaluation domains. Serves as inspiration for research analytics and autonomous MCP agents.
data_source: metrics

groups:
  - {id: executive_overview, title: "1. Executive Overview & Multi-Domain Radar Profiles"}
  - {id: correlation_and_pivots, title: "2. Correlation Matrix & Strategic Pivot Grids"}
  - {id: safety_and_collisions, title: "3. Safety Integrity, Collisions & Reaction Margins"}
  - {id: path_efficiency_and_time, title: "4. Geodesic Efficiency & Temporal Dynamics"}
  - {id: trajectory_naturalness, title: "5. Trajectory Naturalness & Deviation vs Theta* Baseline"}
  - {id: motion_kinematics, title: "6. Kinematic Dynamics & Motion Profiles"}
  - {id: path_smoothness, title: "7. Geometric Smoothness, Curvature & Roughness"}
  - {id: proxemics_and_personal_space, title: "8. Proxemics Zones & Personal Space Intrusion (PSII)"}
  - {id: social_etiquette_and_forces, title: "9. Passing Etiquette, Directional Forces & Mutual Gaze"}
  - {id: energy_and_cost_of_transport, title: "10. Electrical Energy, S-CoT & Holistic E-CoT"}
  - {id: dynamic_dissipation_and_losses, title: "11. Kinetic Demand, Friction Losses & Compliance Costs"}
  - {id: environmental_acoustics, title: "12. Environmental Acoustic Emissions & Personal Space Exposure"}
  - {id: time_series_profiles, title: "13. Synchronized Power, Velocity & Battery Timeseries"}
  - {id: multi_objective_tradeoffs, title: "14. Multi-Objective Trade-Off Frontiers & Pareto Analyses"}
  - {id: spatial_trajectories, title: "15. Spatial Robot & Pedestrian Trajectory Overlays"}

units:
  success: "%"
  spl: ""
  time_to_goal: s
  path_length: m
  path_efficiency: ""
  idling_time: s
  relative_throughput: ""
  collision_amount: ""
  collision_amount_wall: ""
  collision_amount_static: ""
  collision_amount_pedestrian: ""
  tti_min: s
  tti_mean: s
  movement_towards_peds_ratio: ""
  ade: m
  fde: m
  adtw: ""
  mhd: m
  frechet_distance: m
  topological_complexity: ""
  theta_star_length: m
  velocity_mean: m/s
  velocity_max: m/s
  acceleration_mean: m/s2
  acceleration_max: m/s2
  jerk_mean: m/s3
  jerk_max: m/s3
  curvature_mean: 1/m
  curvature_max: 1/m
  roughness_mean: rad/m
  roughness_max: rad/m
  angle_over_length: rad/m
  personal_space_intrusion_integral: "m·s"
  passing_rule_compliance: ""
  total_time_in_personal_space: s
  avg_velocity_in_personal_space: m/s
  time_in_intimate_zone: s
  time_in_personal_zone: s
  time_in_social_zone: s
  time_in_public_zone: s
  psi_intimate_events: ""
  psi_personal_events: ""
  psi_social_events: ""
  max_speed_intimate_zone: m/s
  max_speed_personal_zone: m/s
  max_speed_social_zone: m/s
  ci_mean: ""
  ci_max: ""
  social_force_mean: N
  social_force_max: N
  social_force_ped_mean: N
  social_force_ped_max: N
  ped_path_deflection_m: m
  total_time_looking_at_pedestrians: s
  total_time_looked_at_by_pedestrians: s
  energy_total_wh: Wh
  energy_static_wh: Wh
  energy_mechanical_wh: Wh
  energy_thermal_wh: Wh
  specific_cost_of_transport: ""
  e_cot: ""
  kcsc_wh: Wh
  kinetic_energy_demand_j: J
  friction_dissipation_j: J
  power_peak_w: W
  battery_soc_drop_pct: "%"
  aeps_linear_s: s
  ped_max_exposure_dba: dBA
  ped_leq_exposure_dba: dBA
  ped_max_startle_factor: dBA/s
  total_sound_energy_joules: J
  total_acoustic_work_joules: J
  timeseries_power_total_w: W
  timeseries_power_static_w: W
  timeseries_power_mechanical_w: W
  timeseries_power_thermal_w: W
  timeseries_battery_soc: "%"
  timeseries_time_s: s
  timeseries_velocity_linear: m/s

plots:
  # ============================================================================
  # 1. Executive Overview & Multi-Domain Radar Profiles
  # ============================================================================
  - id: master_summary_table
    type: table
    title: Cross-Domain Executive Performance Matrix
    data_key: "*"
    layout_group: executive_overview
    options:
      group_by: [local_planner]
      columns:
        - {metric: success, label: Success, format: "{:.0%}"}
        - {metric: spl, label: SPL, format: "{:.2f}"}
        - {metric: time_to_goal, label: Avg Time (s), format: "{:.1f}"}
        - {metric: path_efficiency, label: Path Effic., format: "{:.2f}"}
        - {metric: collision_amount, label: Collisions, format: "{:.1f}"}
        - {metric: passing_rule_compliance, label: Passing Compl., format: "{:.0%}"}
        - {metric: personal_space_intrusion_integral, label: PSII (m·s), format: "{:.2f}"}
        - {metric: energy_total_wh, label: Energy (Wh), format: "{:.2f}"}
        - {metric: specific_cost_of_transport, label: S-CoT, format: "{:.2f}"}
        - {metric: e_cot, label: E-CoT, format: "{:.2f}"}
        - {metric: ped_leq_exposure_dba, label: Leq (dBA), format: "{:.1f}"}

  - id: radar_master_local_planner
    type: radar
    title: Comprehensive Performance Radar by Local Planner
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_overview
    options:
      metrics: [success, spl, path_efficiency, passing_rule_compliance, relative_throughput, collision_amount, jerk_mean, personal_space_intrusion_integral, specific_cost_of_transport, e_cot]

  - id: radar_master_inter_planner
    type: radar
    title: Comprehensive Performance Radar by Inter-Planner
    data_key: "*"
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: executive_overview
    options:
      metrics: [success, spl, path_efficiency, passing_rule_compliance, relative_throughput, collision_amount, jerk_mean, personal_space_intrusion_integral, specific_cost_of_transport, e_cot]

  - id: radar_safety_domain
    type: radar
    title: Safety Domain Focused Profile
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_overview
    options:
      metrics: [success, spl, collision_amount, tti_min, ci_max, jerk_mean]

  - id: radar_social_domain
    type: radar
    title: Social Co-Navigation Focused Profile
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_overview
    options:
      metrics: [passing_rule_compliance, personal_space_intrusion_integral, social_force_ped_max, ci_max, ped_path_deflection_m, time_in_intimate_zone]

  - id: radar_ecological_domain
    type: radar
    title: Ecological & Transport Efficiency Profile
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_overview
    options:
      metrics: [energy_total_wh, specific_cost_of_transport, e_cot, kcsc_wh, kinetic_energy_demand_j, ped_leq_exposure_dba, spl]

  # ============================================================================
  # 2. Correlation Matrix & Strategic Pivot Grids
  # ============================================================================
  - id: global_correlation_matrix
    type: heatmap
    title: Global All-Metrics Correlation Matrix
    data_key: "*"
    layout_group: correlation_and_pivots

  - id: heatmap_success_pivot
    type: heatmap
    title: Success Rate Pivot Matrix (Local vs. Inter Planner)
    data_key: success
    layout_group: correlation_and_pivots
    options: {x: inter_planner, y: local_planner}

  - id: heatmap_spl_pivot
    type: heatmap
    title: SPL Pivot Matrix (Local vs. Inter Planner)
    data_key: spl
    layout_group: correlation_and_pivots
    options: {x: inter_planner, y: local_planner}

  - id: heatmap_ecot_pivot
    type: heatmap
    title: Effective Cost of Transport (E-CoT) Pivot Matrix
    data_key: e_cot
    layout_group: correlation_and_pivots
    options: {x: inter_planner, y: local_planner}

  - id: heatmap_psii_pivot
    type: heatmap
    title: Personal Space Intrusion (PSII) Pivot Matrix
    data_key: personal_space_intrusion_integral
    layout_group: correlation_and_pivots
    options: {x: inter_planner, y: local_planner}

  # ============================================================================
  # 3. Safety Integrity, Collisions & Reaction Margins
  # ============================================================================
  - id: bar_success_local
    type: bar
    title: Navigation Success Rate by Local Planner
    data_key: success
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: bar_success_inter
    type: bar
    title: Navigation Success Rate by Inter-Planner
    data_key: success
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: bar_spl_local
    type: bar
    title: Success weighted by Path Length (SPL) by Local Planner
    data_key: spl
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: bar_spl_inter
    type: bar
    title: Success weighted by Path Length (SPL) by Inter-Planner
    data_key: spl
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: box_collisions_local
    type: box
    title: Total Collision Amount by Local Planner
    data_key: collision_amount
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: violin_collisions_inter
    type: violin
    title: Total Collision Amount by Inter-Planner
    data_key: collision_amount
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: bar_collision_breakdown
    type: bar
    title: Collision Breakdown by Obstacle Type
    data_key: collision_amount
    differentiate: local_planner
    layout_group: safety_and_collisions
    options:
      stacked: true
      metrics: [collision_amount_wall, collision_amount_static, collision_amount_pedestrian]

  - id: box_tti_min_local
    type: box
    title: Minimum Time to Collision (TTI min in seconds)
    data_key: tti_min
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: violin_tti_mean_local
    type: violin
    title: Mean Time to Collision (TTI mean in seconds)
    data_key: tti_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  - id: box_movement_towards_peds_local
    type: box
    title: Ratio of Time Spent Moving Towards Pedestrians
    data_key: movement_towards_peds_ratio
    differentiate: local_planner
    auto_differentiate: false
    layout_group: safety_and_collisions

  # ============================================================================
  # 4. Geodesic Efficiency & Temporal Dynamics
  # ============================================================================
  - id: violin_efficiency_local
    type: violin
    title: Geodesic Path Efficiency (vs Theta* Demonstration) by Local Planner
    data_key: path_efficiency
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: violin_efficiency_inter
    type: violin
    title: Geodesic Path Efficiency (vs Theta* Demonstration) by Inter-Planner
    data_key: path_efficiency
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: violin_time_local
    type: violin
    title: Time to Goal (s) by Local Planner
    data_key: time_to_goal
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: violin_time_inter
    type: violin
    title: Time to Goal (s) by Inter-Planner
    data_key: time_to_goal
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: box_idling_local
    type: box
    title: Idling Time (s) by Local Planner
    data_key: idling_time
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: histogram_path_length_local
    type: histogram
    title: Path Length Distribution (m) by Local Planner
    data_key: path_length
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  - id: box_relative_throughput_local
    type: box
    title: Relative Throughput (vs Unobstructed Benchmark Stage)
    data_key: relative_throughput
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_efficiency_and_time

  # ============================================================================
  # 5. Trajectory Naturalness & Deviation vs Theta* Baseline
  # ============================================================================
  - id: box_ade_local
    type: box
    title: Average Displacement Error (ADE vs. Theta* in m)
    data_key: ade
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  - id: box_fde_local
    type: box
    title: Final Displacement Error (FDE in m)
    data_key: fde
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  - id: box_frechet_local
    type: box
    title: Discrete Fréchet Distance (Curve Alignment in m)
    data_key: frechet_distance
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  - id: violin_mhd_local
    type: violin
    title: Modified Hausdorff Distance (MHD in m)
    data_key: mhd
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  - id: box_adtw_local
    type: box
    title: Average Dynamic Time Warping (ADTW)
    data_key: adtw
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  - id: box_topological_complexity_local
    type: box
    title: Topological Complexity (Net Signed Winding Loops W)
    data_key: topological_complexity
    differentiate: local_planner
    auto_differentiate: false
    layout_group: trajectory_naturalness

  # ============================================================================
  # 6. Kinematic Dynamics & Motion Profiles
  # ============================================================================
  - id: violin_velocity_local
    type: violin
    title: Mean Linear Velocity (m/s) by Local Planner
    data_key: velocity_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  - id: box_velocity_max_local
    type: box
    title: Peak Linear Velocity (m/s) by Local Planner
    data_key: velocity_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  - id: box_acceleration_local
    type: box
    title: Mean Acceleration (m/s2) by Local Planner
    data_key: acceleration_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  - id: box_acceleration_max_local
    type: box
    title: Peak Acceleration (m/s2) by Local Planner
    data_key: acceleration_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  - id: box_jerk_local
    type: box
    title: Mean Jerk (m/s3) by Local Planner
    data_key: jerk_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  - id: box_jerk_max_local
    type: box
    title: Peak Jerk (m/s3) by Local Planner
    data_key: jerk_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: motion_kinematics

  # ============================================================================
  # 7. Geometric Smoothness, Curvature & Roughness
  # ============================================================================
  - id: violin_curvature_local
    type: violin
    title: Mean Path Curvature (1/m) by Local Planner
    data_key: curvature_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_smoothness

  - id: box_curvature_max_local
    type: box
    title: Peak Path Curvature (1/m) by Local Planner
    data_key: curvature_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_smoothness

  - id: violin_roughness_local
    type: violin
    title: Mean Path Roughness (rad/m) by Local Planner
    data_key: roughness_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_smoothness

  - id: box_roughness_max_local
    type: box
    title: Peak Path Roughness (rad/m) by Local Planner
    data_key: roughness_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_smoothness

  - id: box_angle_over_length_local
    type: box
    title: Angle Variation Over Path Length (rad/m)
    data_key: angle_over_length
    differentiate: local_planner
    auto_differentiate: false
    layout_group: path_smoothness

  # ============================================================================
  # 8. Proxemics Zones & Personal Space Intrusion (PSII)
  # ============================================================================
  - id: violin_psii_local
    type: violin
    title: Personal Space Intrusion Integral (PSII Penetration Depth in m·s)
    data_key: personal_space_intrusion_integral
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: violin_psii_inter
    type: violin
    title: Personal Space Intrusion Integral (PSII Depth) by Inter-Planner
    data_key: personal_space_intrusion_integral
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: violin_personal_space_local
    type: violin
    title: Time in Personal Zone (0.45m - 1.2m)
    data_key: total_time_in_personal_space
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: violin_intimate_zone_local
    type: violin
    title: Time in Intimate Zone (< 0.45m)
    data_key: time_in_intimate_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: box_intimate_events_local
    type: box
    title: Discrete Intimate Space Invasion Events
    data_key: psi_intimate_events
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: box_personal_events_local
    type: box
    title: Discrete Personal Space Invasion Events
    data_key: psi_personal_events
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: box_speed_personal_zone_local
    type: box
    title: Maximum Speed in Personal Zone (m/s)
    data_key: max_speed_personal_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  - id: box_speed_intimate_zone_local
    type: box
    title: Maximum Speed in Intimate Zone (m/s)
    data_key: max_speed_intimate_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_personal_space

  # ============================================================================
  # 9. Passing Etiquette, Directional Forces & Mutual Gaze
  # ============================================================================
  - id: bar_passing_compliance_local
    type: bar
    title: Passing Rule Compliance Ratio (Right-Hand Corridor Rule)
    data_key: passing_rule_compliance
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: bar_passing_compliance_inter
    type: bar
    title: Passing Rule Compliance Ratio by Inter-Planner
    data_key: passing_rule_compliance
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: box_ci_max_local
    type: box
    title: Directional Collision Index (CI Max, Anisotropic Gaussian)
    data_key: ci_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: violin_ci_mean_local
    type: violin
    title: Directional Collision Index (CI Mean)
    data_key: ci_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: box_social_force_ped_max_local
    type: box
    title: Maximum Social Force on Pedestrians (N)
    data_key: social_force_ped_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: violin_deflection_local
    type: violin
    title: Pedestrian Path Deflection (m)
    data_key: ped_path_deflection_m
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: box_looking_at_peds_local
    type: box
    title: Total Time Looking at Pedestrians (s)
    data_key: total_time_looking_at_pedestrians
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  - id: box_looked_at_by_peds_local
    type: box
    title: Total Time Looked at by Pedestrians (s)
    data_key: total_time_looked_at_by_pedestrians
    differentiate: local_planner
    auto_differentiate: false
    layout_group: social_etiquette_and_forces

  # ============================================================================
  # 10. Electrical Energy, S-CoT & Holistic E-CoT
  # ============================================================================
  - id: bar_energy_breakdown
    type: bar
    title: Subsystem Energy Breakdown (%)
    data_key: energy_total_wh
    differentiate: local_planner
    layout_group: energy_and_cost_of_transport
    options:
      stacked: true
      metrics: [energy_static_wh, energy_mechanical_wh, energy_thermal_wh]

  - id: violin_energy_local
    type: violin
    title: Total Electrical Energy Consumption (Wh)
    data_key: energy_total_wh
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  - id: violin_scot_local
    type: violin
    title: Specific Cost of Transport (S-CoT = E / (m·g·d))
    data_key: specific_cost_of_transport
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  - id: violin_scot_inter
    type: violin
    title: Specific Cost of Transport (S-CoT) by Inter-Planner
    data_key: specific_cost_of_transport
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  - id: box_ecot_local
    type: box
    title: Effective Cost of Transport (E-CoT penalized for collisions & PSII)
    data_key: e_cot
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  - id: box_ecot_inter
    type: box
    title: Effective Cost of Transport (E-CoT) by Inter-Planner
    data_key: e_cot
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  - id: box_battery_drop_local
    type: box
    title: Battery State-of-Charge Drop (%)
    data_key: battery_soc_drop_pct
    differentiate: local_planner
    auto_differentiate: false
    layout_group: energy_and_cost_of_transport

  # ============================================================================
  # 11. Kinetic Demand, Friction Losses & Compliance Costs
  # ============================================================================
  - id: box_kinetic_energy_demand_local
    type: box
    title: Total Kinetic Energy Demand (J)
    data_key: kinetic_energy_demand_j
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation_and_losses

  - id: box_friction_dissipation_local
    type: box
    title: Rolling Friction Dissipation Work (J)
    data_key: friction_dissipation_j
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation_and_losses

  - id: box_kcsc_local
    type: box
    title: Kinematic Cost of Social Compliance (KCSC in Wh)
    data_key: kcsc_wh
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation_and_losses

  - id: box_power_peak_local
    type: box
    title: Peak Electrical Power Draw (W)
    data_key: power_peak_w
    differentiate: local_planner
    auto_differentiate: false
    layout_group: dynamic_dissipation_and_losses

  # ============================================================================
  # 12. Environmental Acoustic Emissions & Personal Space Exposure
  # ============================================================================
  - id: box_aeps_local
    type: box
    title: Acoustic Exposure in Personal Space (AEPS in seconds)
    data_key: aeps_linear_s
    differentiate: local_planner
    auto_differentiate: false
    layout_group: environmental_acoustics

  - id: box_acoustic_leq_local
    type: box
    title: Equivalent Continuous Sound Level at Pedestrians L_Aeq (dBA)
    data_key: ped_leq_exposure_dba
    differentiate: local_planner
    layout_group: environmental_acoustics

  - id: box_acoustic_max_local
    type: box
    title: Maximum Instantaneous Sound Level at Pedestrians L_AFmax (dBA)
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    layout_group: environmental_acoustics

  - id: box_acoustic_startle_local
    type: box
    title: Maximum Acoustic Startle Factor (dBA/s)
    data_key: ped_max_startle_factor
    differentiate: local_planner
    layout_group: environmental_acoustics

  - id: box_sound_energy_local
    type: box
    title: Total Radiated Sound Energy (Joules)
    data_key: total_sound_energy_joules
    differentiate: local_planner
    auto_differentiate: false
    layout_group: environmental_acoustics

  - id: acoustic_field_worst_case
    type: acoustic_field
    title: "Spatial Acoustic Propagation Field (Worst-Case Frame)"
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    group_by: [stage]
    layout_group: environmental_acoustics
    options:
      downsample: 1
      overlay_trajectories: true

  - id: acoustic_field_animation
    type: acoustic_field_animation
    title: "Dynamic Acoustic Field Propagation (Animated Timeline)"
    data_key: ped_max_exposure_dba
    differentiate: local_planner
    group_by: [stage]
    layout_group: environmental_acoustics
    options:
      downsample: 2
      fps: 10
      max_frames: 100
      overlay_trajectories: true
      format: gif

  # ============================================================================
  # 13. Synchronized Power, Velocity & Battery Timeseries
  # ============================================================================
  - id: timeseries_power
    type: timeseries
    title: Subsystem Power Consumption & Battery SOC Over Time
    data_key: timeseries_power_total_w
    differentiate: local_planner
    layout_group: time_series_profiles
    group_by: [stage]
    options:
      x: timeseries_time_s
      metrics: [timeseries_power_total_w, timeseries_power_static_w, timeseries_power_mechanical_w, timeseries_power_thermal_w, timeseries_battery_soc]

  - id: timeseries_velocity
    type: timeseries
    title: Linear Velocity Tracking Profile Over Time
    data_key: timeseries_velocity_linear
    differentiate: local_planner
    layout_group: time_series_profiles
    group_by: [stage]
    options: {x: timeseries_time_s}

  # ============================================================================
  # 14. Multi-Objective Trade-Off Frontiers & Pareto Analyses
  # ============================================================================
  - id: scatter_spl_vs_energy
    type: scatter
    title: Safety-Energy Frontier (SPL vs. Total Energy in Wh)
    data_key: energy_total_wh
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: spl}

  - id: scatter_time_vs_ecot
    type: scatter
    title: Efficiency-Holistic Frontier (Time to Goal vs. E-CoT)
    data_key: time_to_goal
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: e_cot}

  - id: scatter_velocity_vs_psii
    type: scatter
    title: Speed-Comfort Frontier (Mean Velocity vs. PSII)
    data_key: velocity_mean
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: personal_space_intrusion_integral}

  - id: scatter_scot_vs_efficiency
    type: scatter
    title: Energy Efficiency vs. Path Optimality (S-CoT vs. Path Efficiency)
    data_key: path_efficiency
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: specific_cost_of_transport}

  - id: scatter_passing_vs_psii
    type: scatter
    title: Etiquette vs. Personal Space Intrusion (Passing Compliance vs. PSII)
    data_key: passing_rule_compliance
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: personal_space_intrusion_integral}

  - id: scatter_ke_vs_jerk
    type: scatter
    title: Dynamic Stress vs. Jerk Reactivity (Kinetic Energy Demand vs. Mean Jerk)
    data_key: jerk_mean
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: kinetic_energy_demand_j}

  - id: scatter_aeps_vs_clearance
    type: scatter
    title: Acoustic Discomfort vs. Physical Intrusion (AEPS vs. PSII)
    data_key: personal_space_intrusion_integral
    differentiate: local_planner
    layout_group: multi_objective_tradeoffs
    options: {y: aeps_linear_s}

  # ============================================================================
  # 15. Spatial Robot & Pedestrian Trajectory Overlays
  # ============================================================================
  - id: trajectory_plot
    type: trajectory
    title: Spatial Robot Navigation Trajectories with Map Overlays
    data_key: path
    differentiate: local_planner
    auto_differentiate: false
    group_by: [stage]
    layout_group: spatial_trajectories
    filter: {is_reference: false}

  - id: pedestrian_trajectory_plot
    type: trajectory
    title: Spatial Pedestrian Trajectories & Interactive Encounter Corridors
    data_key: pedestrian_path
    differentiate: local_planner
    auto_differentiate: false
    group_by: [stage]
    layout_group: spatial_trajectories
    options: {overlay_markers: false}
