# Studies A' and C, generated by arena_evaluation.experiments.social generate.
# Each case runs twice on the same seeds; the arm is the suite AND the contest:
#   on   suite social_on  + contest paper_planners        (gesture + interaction ids + cost layer)
#   off  suite social_off + contest paper_planners_blind  (none of the three)
stages:
- name: contact_hug_ward_off
  map: hospital_1_bare
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
