- name: mb__E05_door_flapping__b-to-a
  map: mechanisms_doors
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
  episodes: 3
  timeout: 90s
  config:
    scenario:
      file: E05_door_flapping__b-to-a
- name: mb__E03_elevator_outage__up
  map: mechanisms_elevator
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
  episodes: 3
  timeout: 90s
