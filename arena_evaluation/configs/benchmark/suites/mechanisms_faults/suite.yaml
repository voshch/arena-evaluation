name: mechanisms_faults
launch:
  sim: gazebo
  headless: true
  env.n: 2
  lockstep: true
  lockstep.paused: false
metrics:
  max_collisions: 1
stages:
- name: mb__E01_door_stuck_open__a-to-b
  map: mechanisms_doorway
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
  episodes: 3
  timeout: 120s
  config:
    scenario:
      file: E01_door_stuck_open__a-to-b
- name: mb__E01_door_stuck_open__b-to-a
  map: mechanisms_doorway
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
  episodes: 3
  timeout: 120s
  config:
    scenario:
      file: E01_door_stuck_open__b-to-a
- name: mb__E02_door_stuck_closed__a-to-b
  map: mechanisms_doors
  robot: jackal
  tm_robots: scenario
  tm_obstacles: scenario
  episodes: 3
  timeout: 90s
  config:
    scenario:
      file: E02_door_stuck_closed__a-to-b
- name: mb__E02_door_stuck_closed__b-to-a
  map: mechanisms_doors
  robot: jackal
