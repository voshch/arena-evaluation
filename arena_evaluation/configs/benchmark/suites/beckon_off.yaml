# Study B, a pedestrian calls a patrolling robot for help (EVALUATION.md B).
# Generated by arena_evaluation.experiments.beckon generate. Each case runs twice on the same seeds:
#   _call   gesture_mode=enabled  the call is rendered and published
#   _silent gesture_mode=disabled the same pedestrian stands in the same place and publishes nothing
# Run:     ros2 run arena_evaluation benchmark --suite beckon_service --contest paper_planners headless:=true
# Analyze: python -m arena_evaluation.experiments.beckon analyze --benchmark-dir <data_root>/<run_id>
stages:
- name: beckon_hall_near_off
  map: hospital_1_bare
  robot: jackal
  tm_robots: patrol
  tm_obstacles: scenario
  episodes: 2
  seed: 72000
  timeout: 90s
  config:
    scenario:
      file: beckon_hall_near
      gesture_mode: disabled
    patrol:
      service_agent: caller
      clip: beckon
      service_radius: 2.5
      service_dwell: 0.0
- name: beckon_hall_far_off
