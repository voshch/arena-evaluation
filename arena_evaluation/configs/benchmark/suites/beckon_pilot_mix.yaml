# gesture on, cost layer off
stages:
- name: beckon_hall_far_on
  map: hospital_1_bare
  robot: jackal
  tm_robots: patrol
  tm_obstacles: scenario
  episodes: 1
  seed: 72001
  timeout: 90s
  config:
    scenario:
      file: beckon_hall_far
      gesture_mode: enabled
    patrol:
      service_agent: caller
      clip: beckon
      service_radius: 2.5
      service_dwell: 0.0
