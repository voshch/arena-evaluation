name: contact_attribution_summary
title: "Contact Attribution Summary"
description: "Pedestrian-contact attribution across planners and crowd conditions. The robot closing share is
  the pooled ratio of the closing speeds, not the mean of the per-contact shares, and only pedestrian contacts
  participate (a wall or another robot cannot close in)."
parameters:
  crowd_condition:
    type: string
    default: "all"
    description: "Filter by crowd condition ('all', 'visible', 'blind', 'mixed')"
  planner:
    type: string
    default: "all"
    description: "Filter by planner name or 'all'"
sql: |
  SELECT
      ep.crowd_condition,
      ep.local_planner,
      COUNT(*) AS total_contacts,
      AVG(c.relative_impact_speed_mps) AS mean_relative_impact_speed_mps,
      SUM(CASE WHEN c.v_close_robot_mps > 0 THEN c.v_close_robot_mps ELSE 0 END)
        / NULLIF(
            SUM(CASE WHEN c.v_close_robot_mps > 0 THEN c.v_close_robot_mps ELSE 0 END)
            + SUM(CASE WHEN c.v_close_target_mps > 0 THEN c.v_close_target_mps ELSE 0 END),
            0
          ) AS mean_robot_closing_share,
      AVG(c.freeze_clearance_m) AS mean_freeze_clearance_m
  FROM v_contacts c
  JOIN v_episode_summary ep USING (run_id, episode_id, robot_id)
  WHERE c.collider_kind = 'pedestrian'
    AND (:crowd_condition = 'all' OR ep.crowd_condition = :crowd_condition)
    AND (:planner = 'all' OR ep.planner = :planner)
  GROUP BY ep.crowd_condition, ep.local_planner
  ORDER BY ep.crowd_condition, ep.local_planner
