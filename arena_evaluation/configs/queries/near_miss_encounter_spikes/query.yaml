name: near_miss_encounter_spikes
title: "Near-Miss Encounter Clearance & Energy Spikes"
description: "Identifies high-risk near-miss encounters where clearance was critical and energy surged; rows with NULL min_clearance_m or NULL energy_surge_ratio are excluded by the WHERE predicates"
parameters:
  max_clearance_m:
    type: float
    default: 1.2
    description: "Maximum clearance threshold in meters"
  min_surge_ratio:
    type: float
    default: 1.5
    description: "Minimum energy surge ratio threshold"
sql: |
  SELECT
      ep.crowd_condition,
      ep.planner,
      e.approach_type,
      COUNT(*) AS near_miss_count,
      AVG(e.min_clearance_m) AS mean_min_clearance_m,
      AVG(e.duration_s) AS mean_duration_s,
      AVG(e.energy_surge_ratio) AS mean_energy_surge_ratio,
      AVG(e.energy_total_wh) AS mean_energy_total_wh,
      AVG(e.probst_R_robot) AS mean_probst_R_robot,
      AVG(e.probst_R_actor2) AS mean_probst_R_actor2,
      SUM(CASE WHEN e.contact_id IS NOT NULL AND e.contact_id != '' THEN 1 ELSE 0 END) AS contact_count
  FROM fact_encounters e
  JOIN v_episode_summary ep USING (run_id, episode_id, robot_id)
  WHERE e.min_clearance_m IS NOT NULL
    AND e.energy_surge_ratio IS NOT NULL
    AND e.min_clearance_m <= :max_clearance_m
    AND e.energy_surge_ratio >= :min_surge_ratio
  GROUP BY ep.crowd_condition, ep.planner, e.approach_type
  ORDER BY ep.crowd_condition, ep.planner, e.approach_type
