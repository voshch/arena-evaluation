name: robot_tracks_non_ref
description: Robot trajectory samples filtered to non-reference episodes, joined to the episode on its full
  (episode_id, robot_id) key so a sample is never repeated once per robot of the episode. An episode whose
  reference flag was not recorded counts as non-reference.
sql: |
  SELECT
      d.run_id,
      t.episode_id,
      t.robot_id,
      d.world,
      d.planner,
      t.t_ns,
      t.x,
      t.y,
      t.yaw
  FROM robot_tracks t
  JOIN dim_episodes d
    ON t.episode_id = d.episode_id AND t.robot_id = d.robot_id
  WHERE d.is_reference IS NOT TRUE
  ORDER BY t.episode_id, t.robot_id, t.t_ns
