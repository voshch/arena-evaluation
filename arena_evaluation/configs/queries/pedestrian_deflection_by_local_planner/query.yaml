name: pedestrian_deflection_by_local_planner
title: "Pedestrian Path Deflection by Local Planner"
description: "Pedestrian path deflection joined with the episode local planner, one row per
  pedestrian. The episode is collapsed to one row per (run_id, episode_id) before the join, because
  the local planner is an episode attribute and dim_episodes holds one row per robot."
sql: |
  WITH episode_local_planner AS (
      SELECT run_id, episode_id, MAX(local_planner) AS local_planner
      FROM dim_episodes
      GROUP BY run_id, episode_id
  )
  SELECT
      e.local_planner,
      p.ped_path_deflection_m
  FROM fact_pedestrians p
  JOIN episode_local_planner e
    ON p.run_id = e.run_id AND p.episode_id = e.episode_id
  ORDER BY e.local_planner, p.ped_id
