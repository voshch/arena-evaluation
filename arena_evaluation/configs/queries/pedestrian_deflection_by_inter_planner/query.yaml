name: pedestrian_deflection_by_inter_planner
title: "Pedestrian Path Deflection by Inter-Planner"
description: "Pedestrian path deflection joined with the episode inter-planner, one row per pedestrian. The
  episode is collapsed to one row per (run_id, episode_id) before the join, because the inter-planner is an
  episode attribute and dim_episodes holds one row per robot."
sql: |
  WITH episode_inter_planner AS (
      SELECT run_id, episode_id, MAX(inter_planner) AS inter_planner
      FROM dim_episodes
      GROUP BY run_id, episode_id
  )
  SELECT
      e.inter_planner,
      p.ped_path_deflection_m
  FROM fact_pedestrians p
  JOIN episode_inter_planner e
    ON p.run_id = e.run_id AND p.episode_id = e.episode_id
