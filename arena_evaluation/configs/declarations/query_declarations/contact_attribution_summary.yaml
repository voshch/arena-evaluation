name: contact_attribution_summary
title: "Contact Attribution Summary"
description: "Contact attribution scalars across planners and crowd conditions"
parameters:
  crowd_condition:
    type: string
    default: "all"
    description: "Filter by crowd condition ('all', 'visible', 'blind', 'mixed')"
  planner:
    type: string
    default: "all"
    description: "Filter by planner name or 'all'"
sql: |
  SELECT
      ep.crowd_condition,
      ep.planner,
      COUNT(*) AS total_contacts,
      AVG(c.relative_impact_speed_mps) AS mean_relative_impact_speed_mps,
      AVG(c.robot_closing_share) AS mean_robot_closing_share,
      AVG(c.freeze_clearance_m) AS mean_freeze_clearance_m
  FROM v_contacts c
  JOIN v_episode_summary ep USING (run_id, episode_id, robot_id)
  WHERE (:crowd_condition = 'all' OR ep.crowd_condition = :crowd_condition)
    AND (:planner = 'all' OR ep.planner = :planner)
  GROUP BY ep.crowd_condition, ep.planner
  ORDER BY ep.crowd_condition, ep.planner
