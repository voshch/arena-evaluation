name: blind_vs_aware_standoff_delta
title: "Crowd Visibility Standoff Delta"
description: "Compares clearance standoff distances, detour times, and Probst responsibility metrics across crowd conditions and planners"
parameters:
  planner:
    type: string
    default: "all"
    description: "Filter by planner name or 'all'"
sql: |
  SELECT
      ep.planner,
      ep.crowd_condition,
      COUNT(*) AS total_encounters,
      AVG(e.min_clearance_m) AS mean_min_clearance_m,
      AVG(e.detour_time_s) AS mean_detour_time_s,
      AVG(e.robot_path_deviation_m) AS mean_robot_path_deviation_m,
      AVG(e.probst_R_robot) AS mean_probst_R_robot,
      AVG(e.probst_R_actor2) AS mean_probst_R_actor2,
      AVG(e.probst_E_robot) AS mean_probst_E_robot
  FROM fact_encounters e
  JOIN v_episode_summary ep USING (run_id, episode_id, robot_id)
  WHERE (:planner = 'all' OR ep.planner = :planner)
  GROUP BY ep.planner, ep.crowd_condition
  ORDER BY ep.planner, ep.crowd_condition
