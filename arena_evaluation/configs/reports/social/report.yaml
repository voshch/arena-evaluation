title: Social Navigation & Human-Robot Interaction Report
description: Comprehensive human-robot social co-navigation report covering proxemics
  zones, intrusion depth (PSII), passing etiquette compliance, social force disturbances,
  gaze, acoustic comfort, and encounter dynamics.
units:
  aeps_linear_s: 's'
  energy_mechanical_wh: 'Wh'
  energy_static_wh: 'Wh'
  energy_thermal_wh: 'Wh'
  max_speed_intimate_zone: 'm/s'
  max_speed_personal_zone: 'm/s'
  mean_speed_mps: 'm/s'
  mean_velocity_mps: 'm/s'
  path_length_m: 'm'
  ped_path_deflection_m: 'm'
  personal_space_intrusion_integral: 'm*s'
  spl_geodesic: ''
  success: '%'
  time_in_intimate_zone: 's'
  time_to_goal: 's'
  total_time_in_personal_space: 's'
  total_time_looked_at_by_pedestrians: 's'
  total_time_looking_at_pedestrians: 's'
  tti_min: 's'
summary_group_by:
- planner
summary:
- metric: success
  label: Success
  format: '{:.0%}'
- metric: spl_geodesic
  label: SPL
  format: '{:.2f}'
- metric: personal_space_intrusion_integral
  label: PSII
  format: '{:.2f}'
- metric: time_in_intimate_zone
  label: Time in Intimate Zone
  format: '{:.1f}'
- metric: aeps_linear_s
  label: AEPS Linear
  format: '{:.1f}'
- metric: collision_amount
  label: Collisions
  format: '{:.1f}'
groups:
- id: overview
  title: Social Performance Overview
- id: encounters
  title: Spatiotemporal Encounters & Fault Attribution
- id: proxemics_zones
  title: Proxemics & Zone Penetration Depth
- id: etiquette_compliance
  title: Passing Etiquette & Corridor Navigation Rules
- id: social_forces
  title: Directional Social Forces & Pedestrian Disturbance
- id: gaze_interaction
  title: Mutual Gaze & Attention Dynamics
- id: acoustics
  title: Pedestrian Acoustic Exposure & Noise Dose
- id: acoustic_comfort
  title: Pedestrian Acoustic Comfort & Exposure
- id: social_tradeoffs
  title: Social Multi-Objective Trade-Off Frontiers
- id: details
  title: Encounter Traces & Trajectory Maps
plots:
- id: social_scorecard_table
  uses: scorecard_table
  title: Social Benchmark Executive Scorecard
  layout_group: overview
- id: e8_success_contact_panel
  uses: success_without_contact_panel
  title: Success without Pedestrian Contact by Planner and Crowd Condition
  layout_group: overview
- id: e8_success_contact_interval
  uses: success_without_contact_interval
  title: Visible minus Blind Difference in Success without Pedestrian Contact (cluster bootstrap 95% CI)
  layout_group: overview
- id: social_radar
  title: Social Capability Tradeoff Radar
  layout_group: overview
  type: radar
  data:
    computation: radar_profile
    params:
      group_col: planner
      metrics:
      - personal_space_intrusion_integral
      - time_in_intimate_zone
      - aeps_linear_s
      - tti_min
      - collision_amount
  channels:
    x: metric
    y: normalized_score
    color: planner
- id: social_closer_attribution
  uses: contact_closing_share
  title: Collision Fault Attribution by Crowd Condition
  layout_group: encounters
- id: social_encounter_energy
  type: bar
  title: Social Encounter Energy
  data:
    computation: group_summary
    params:
      metrics:
      - energy_static_wh
      - energy_mechanical_wh
      - energy_thermal_wh
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
    color: metric
  layout_group: encounters
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: social_encounter_trajectory
  type: trajectory
  title: Social Encounter Trajectory
  data:
    source: robot_tracks
  channels:
    x: x
    y: y
    color: robot_id
  layout_group: encounters
- id: violin_psii_local
  type: violin
  title: Personal Space Intrusion Integral (PSII Depth) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: personal_space_intrusion_integral
  layout_group: proxemics_zones
- id: violin_psii_inter
  type: violin
  title: Personal Space Intrusion Integral (PSII Depth) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: personal_space_intrusion_integral
  layout_group: proxemics_zones
- id: violin_personal_space_local
  type: violin
  title: Time in Personal Zone (0.45m - 1.2m) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_in_personal_space
  layout_group: proxemics_zones
- id: violin_intimate_zone_local
  type: violin
  title: Time in Intimate Zone (< 0.45m) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: time_in_intimate_zone
  layout_group: proxemics_zones
- id: box_intimate_events_local
  type: box
  title: Discrete Intimate Space Intrusion Events by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: psi_intimate_events
  layout_group: proxemics_zones
- id: box_personal_events_local
  type: box
  title: Discrete Personal Space Intrusion Events by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: psi_personal_events
  layout_group: proxemics_zones
- id: bar_passing_compliance_local
  type: bar
  title: Passing Rule Compliance Ratio (Right-Hand Rule) by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - passing_rule_compliance
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
  layout_group: etiquette_compliance
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_passing_compliance_inter
  type: bar
  title: Passing Rule Compliance Ratio (Right-Hand Rule) by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - passing_rule_compliance
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: etiquette_compliance
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: box_speed_personal_zone_local
  type: box
  title: Max Speed Inside Personal Space by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: max_speed_personal_zone
  layout_group: etiquette_compliance
- id: box_speed_intimate_zone_local
  type: box
  title: Max Speed Inside Intimate Space by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: max_speed_intimate_zone
  layout_group: etiquette_compliance
- id: box_ci_max_local
  type: box
  title: Directional Collision Index (CI Max) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: ci_max
  layout_group: social_forces
- id: violin_ci_mean_local
  type: violin
  title: Directional Collision Index (CI Mean) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: ci_mean
  layout_group: social_forces
- id: violin_deflection_local
  type: violin
  title: Pedestrian Path Deflection (m) by Local Planner
  data:
    source: fact_pedestrians
  channels:
    x: ped_policy
    y: ped_path_deflection_m
  layout_group: social_forces
- id: violin_deflection_inter
  type: violin
  title: Pedestrian Path Deflection (m) by Inter-Planner
  data:
    stored_query: pedestrian_deflection_by_inter_planner
  channels:
    x: inter_planner
    y: ped_path_deflection_m
  layout_group: social_forces
- id: box_looking_at_peds_local
  type: box
  title: Time Looking at Pedestrians by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_looking_at_pedestrians
  layout_group: gaze_interaction
- id: box_looking_at_peds_inter
  type: box
  title: Time Looking at Pedestrians by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: total_time_looking_at_pedestrians
  layout_group: gaze_interaction
- id: box_looked_at_by_peds_local
  type: box
  title: Time Looked at by Pedestrians by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_looked_at_by_pedestrians
  layout_group: gaze_interaction
- id: box_looked_at_by_peds_inter
  type: box
  title: Time Looked at by Pedestrians by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: total_time_looked_at_by_pedestrians
  layout_group: gaze_interaction
- id: encounter_hierarchy_sunburst
  uses: encounter_hierarchy_treemap
  title: Encounter Counts by Crowd Condition, Planner and Approach (Sunburst)
  layout_group: acoustics
  options:
    mode: sunburst
- id: box_aeps_local
  type: box
  title: Acoustic Exposure in Personal Space (AEPS) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: aeps_linear_s
  layout_group: acoustic_comfort
- id: planner_scorecard_table
  type: table
  title: Planner Scorecard Table
  data:
    source: v_planner_scorecard
  channels:
    x: planner
    y:
    - episodes_count
    - success_rate
    - mean_time_to_goal
    - mean_path_efficiency
  layout_group: social_tradeoffs
- id: planner_metric_correlation_heatmap
  type: heatmap
  title: Planner Metric Correlation Heatmap
  data:
    computation: correlation_matrix
    params:
      metrics:
      - success
      - time_to_goal
      - path_length_m
      - mean_velocity_mps
      - personal_space_intrusion_integral
  channels:
    x: metric_x
    y: metric_y
    color: pearson_r
  layout_group: social_tradeoffs
- id: encounter_hierarchy_treemap
  uses: encounter_hierarchy_treemap
  title: Encounter Hierarchy Treemap
  layout_group: social_tradeoffs
- id: scatter_passing_vs_psii
  type: scatter
  title: Etiquette vs. Personal Space Intrusion (Passing Compliance vs. PSII)
  data:
    source: v_episode_summary
  channels:
    x: passing_rule_compliance
    y: personal_space_intrusion_integral
    color: planner
  layout_group: social_tradeoffs
- id: scatter_speed_vs_deflection
  type: scatter
  title: Proximity Speed vs. Pedestrian Disturbance (Speed in Personal Space vs. Deflection)
  data:
    source: fact_pedestrians
  channels:
    x: mean_speed_mps
    y: ped_path_deflection_m
    color: ped_policy
  layout_group: social_tradeoffs
- id: scatter_psii_vs_time
  type: scatter
  title: Politeness vs. Travel Efficiency (PSII vs. Time to Goal)
  data:
    source: v_episode_summary
  channels:
    x: time_to_goal
    y: personal_space_intrusion_integral
    color: planner
  layout_group: social_tradeoffs
- id: scatter_aeps_vs_psii
  type: scatter
  title: Acoustic Discomfort vs. Physical Intrusion (AEPS vs. PSII)
  data:
    source: v_episode_summary
  channels:
    x: personal_space_intrusion_integral
    y: aeps_linear_s
    color: planner
  layout_group: social_tradeoffs
- id: trajectory_plot
  type: trajectory
  title: Spatial Robot Navigation Trajectories with Map Overlays
  data:
    stored_query: robot_tracks_non_ref
  channels:
    x: x
    y: y
    color: robot_id
  layout_group: encounters
- id: pedestrian_trajectory_plot
  type: trajectory
  title: Spatial Pedestrian Trajectories & Encounter Corridors
  data:
    stored_query: pedestrian_arena_peds_non_ref
  channels:
    x: x
    y: y
    color: ped_id
  layout_group: encounters
