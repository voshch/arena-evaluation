title: Standard Benchmark Report
description: Standard balanced arena_evaluation report covering performance, safety,
  efficiency, naturalness, motion, smoothness, social interaction, ecology, and trade-off
  frontiers.
units:
  success: '%'
  spl_geodesic: ''
  time_to_goal: s
  path_length: m
  path_efficiency: ''
  idling_time: s
  relative_throughput: ''
  total_collisions_ped: ''
  total_collisions_static: ''
  tti_min: s
  tti_mean: s
  ade: m
  fde: m
  adtw: ''
  mhd: m
  frechet_distance: m
  topological_complexity: ''
  theta_star_length: m
  mean_velocity_mps: m/s
  velocity_max: m/s
  acceleration_mean: m/s2
  max_acceleration_mps2: m/s2
  jerk_max_mps3: m/s3
  curvature_mean: 1/m
  curvature_max: 1/m
  roughness_mean: rad/m
  roughness_max: rad/m
  angle_over_length: rad/m
  personal_space_intrusion_integral: "m\xB7s"
  passing_rule_compliance: ''
  total_time_in_personal_space: s
  avg_velocity_in_personal_space: m/s
  time_in_intimate_zone: s
  time_in_personal_zone: s
  time_in_social_zone: s
  time_in_public_zone: s
  psi_intimate_events: ''
  psi_personal_events: ''
  ci_mean: ''
  ci_max: ''
  social_force_mean: N
  social_force_max: N
  social_force_ped_mean: N
  social_force_ped_max: N
  ped_path_deflection_m: m
  total_time_looking_at_pedestrians: s
  total_time_looked_at_by_pedestrians: s
  total_energy_wh: Wh
  energy_static_wh: Wh
  energy_mechanical_wh: Wh
  energy_thermal_wh: Wh
  specific_cost_of_transport: ''
  e_cot: ''
  kcsc_wh: Wh
  kinetic_energy_demand_j: J
  friction_dissipation_j: J
  power_peak_w: W
  battery_soc_drop_pct: '%'
  aeps_linear_s: s
  ped_max_exposure_dba: dBA
  ped_leq_exposure_dba: dBA
  ped_max_startle_factor: dBA/s
  total_sound_energy_joules: J
  total_acoustic_work_joules: J
  power_total_w: W
  power_static_w: W
  power_mechanical_w: W
  power_thermal_w: W
  battery_soc_pct: '%'
  time_s: s
  velocity_linear_mps: m/s
groups:
- id: overview
  title: Performance Overview
- id: safety
  title: Safety & Collision Metrics
- id: efficiency
  title: Efficiency Metrics
- id: naturalness
  title: Trajectory Naturalness & Deviation
- id: motion
  title: Motion Dynamics Metrics
- id: smoothness
  title: Path Smoothness Metrics
- id: social
  title: Social & Pedestrian Interaction
- id: ecological
  title: Ecological & Energy Metrics
- id: tradeoffs
  title: Multi-Objective Trade-Off Frontiers
- id: details
  title: Detailed Run Traces & Analysis
plots:
- id: overview_table
  title: Benchmark Executive Overview
  layout_group: overview
  type: table
  data:
    computation: group_summary
    params:
      group_cols:
      - planner
      metrics:
      - success
      - spl_geodesic
      - time_to_goal
      - path_length_m
      - path_efficiency
      - collision_amount
      - specific_cost_of_transport
  channels:
    x: planner
    y:
    - metric
    - n
    - mean
    - std
  options:
    labels:
      success: Success
      spl_geodesic: SPL
      time_to_goal: Avg Time
      path_length_m: Avg Path
      path_efficiency: Path Effic.
      collision_amount: Collisions
      specific_cost_of_transport: S-CoT
    format:
      success: '{:.0%}'
      spl_geodesic: '{:.2f}'
      time_to_goal: '{:.1f}'
      path_length_m: '{:.1f}'
      path_efficiency: '{:.2f}'
      collision_amount: '{:.1f}'
      specific_cost_of_transport: '{:.2f}'
- id: radar_local_planner
  uses: multi_planner_radar
  title: Performance Overview by Local Planner
  layout_group: overview
- id: radar_inter_planner
  type: radar
  title: Performance Overview by Inter-Planner
  data:
    computation: radar_profile
    params:
      group_col: inter_planner
      metrics:
      - success
      - path_efficiency
      - roughness_mean
  channels:
    x: metric
    y: normalized_score
    color: inter_planner
  layout_group: overview
- id: correlation_matrix
  type: heatmap
  title: Metrics Correlation Matrix
  data:
    computation: correlation_matrix
    params:
      metrics:
      - success
      - time_to_goal
      - path_length_m
      - mean_velocity_mps
      - energy_total_wh
      - personal_space_intrusion_integral
  channels:
    x: metric_x
    y: metric_y
    color: pearson_r
  layout_group: overview
- id: heatmap_success_pivot
  type: heatmap
  title: Success Rate Pivot Grid (Local vs Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: overview
- id: heatmap_spl_pivot
  type: heatmap
  title: SPL Pivot Grid (Local vs Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: overview
- id: bar_success_local
  type: bar
  title: Success Rate by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_success_inter
  type: bar
  title: Success Rate by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_spl_local
  type: bar
  title: Success weighted by Path Length (SPL) by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_spl_inter
  type: bar
  title: Success weighted by Path Length (SPL) by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_collision_breakdown
  type: bar
  title: Collision Fault Attribution by Obstacle & Crowd Condition
  data:
    computation: group_summary
    params:
      metrics:
      - collision_amount_pedestrian
      - collision_amount_static
      - collision_amount_wall
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
    color: metric
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: box_tti_min_local
  type: box
  title: Minimum Time to Collision (TTI min) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: tti_min
  layout_group: safety
- id: violin_efficiency_local
  type: violin
  title: Geodesic Path Efficiency (vs Theta*) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: path_efficiency
  layout_group: efficiency
- id: violin_efficiency_inter
  type: violin
  title: Geodesic Path Efficiency (vs Theta*) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: path_efficiency
  layout_group: efficiency
- id: violin_time_local
  type: violin
  title: Time to Goal by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: time_to_goal
  layout_group: efficiency
- id: violin_time_inter
  type: violin
  title: Time to Goal by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: time_to_goal
  layout_group: efficiency
- id: box_idling_local
  type: box
  title: Idling Time by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: idling_time
  layout_group: efficiency
- id: box_idling_inter
  type: box
  title: Idling Time by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: idling_time
  layout_group: efficiency
- id: histogram_path_length_local
  type: histogram
  title: Path Length Distribution by Local Planner
  data:
    computation: distribution_bins
    params:
      metric: path_length_m
      group_cols:
      - planner
      nbins: 20
  channels:
    x: bin_center
    y: count
    color: planner
  layout_group: efficiency
  options:
    bin_low: bin_low
    bin_high: bin_high
- id: box_relative_throughput_local
  type: box
  title: Relative Throughput (vs Unobstructed) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: relative_throughput
  layout_group: efficiency
- id: box_ade_local
  type: box
  title: Average Displacement Error (ADE vs Theta*) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: ade
  layout_group: naturalness
- id: box_ade_inter
  type: box
  title: Average Displacement Error (ADE vs Theta*) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: ade
  layout_group: naturalness
- id: box_fde_local
  type: box
  title: Final Displacement Error (FDE) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: fde
  layout_group: naturalness
- id: box_frechet_local
  type: box
  title: "Discrete Fr\xE9chet Distance (vs Theta*) by Local Planner"
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: frechet_distance
  layout_group: naturalness
- id: violin_mhd_local
  type: violin
  title: Modified Hausdorff Distance (MHD vs Theta*) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: mhd
  layout_group: naturalness
- id: box_topological_complexity_local
  type: box
  title: Topological Complexity (Net Winding Number) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: topological_complexity
  layout_group: naturalness
- id: violin_velocity_local
  type: violin
  title: Mean Velocity by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: mean_velocity_mps
  layout_group: motion
- id: violin_velocity_inter
  type: violin
  title: Mean Velocity by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: mean_velocity_mps
  layout_group: motion
- id: box_acceleration_local
  type: box
  title: Mean Acceleration by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: acceleration_mean
  layout_group: motion
- id: box_acceleration_inter
  type: box
  title: Mean Acceleration by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: acceleration_mean
  layout_group: motion
- id: violin_curvature_local
  type: violin
  title: Curvature Mean by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: curvature_mean
  layout_group: smoothness
- id: violin_curvature_inter
  type: violin
  title: Curvature Mean by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: curvature_mean
  layout_group: smoothness
- id: violin_roughness_local
  type: violin
  title: Roughness Mean by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: roughness_mean
  layout_group: smoothness
- id: violin_roughness_inter
  type: violin
  title: Roughness Mean by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: roughness_mean
  layout_group: smoothness
- id: box_angle_over_length_local
  type: box
  title: Angle Over Length by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: angle_over_length
  layout_group: smoothness
- id: acoustic_exposure_sunburst
  type: hierarchy
  title: Acoustic Exposure Sunburst
  data:
    source: v_encounter_summary
  channels:
    hierarchy:
    - crowd_condition
    - planner
    - approach_type
    y: encounter_count
  layout_group: social
  options:
    mode: sunburst
- id: violin_psii_local
  type: violin
  title: Personal Space Intrusion Integral (PSII Depth) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: personal_space_intrusion_integral
  layout_group: social
- id: violin_psii_inter
  type: violin
  title: Personal Space Intrusion Integral (PSII Depth) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: personal_space_intrusion_integral
  layout_group: social
- id: bar_passing_compliance_local
  type: bar
  title: Passing Rule Compliance (Right-Hand Passing) by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - passing_rule_compliance
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
  layout_group: social
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_passing_compliance_inter
  type: bar
  title: Passing Rule Compliance (Right-Hand Passing) by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - passing_rule_compliance
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: social
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: box_ci_max_local
  type: box
  title: Directional Collision Index (CI Max) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: ci_max
  layout_group: social
- id: violin_personal_space_local
  type: violin
  title: Time in Personal Space by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_in_personal_space
  layout_group: social
- id: box_looking_at_peds_local
  type: box
  title: Time Looking at Pedestrians by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_looking_at_pedestrians
  layout_group: social
- id: box_looked_at_by_peds_local
  type: box
  title: Time Looked at by Pedestrians by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: total_time_looked_at_by_pedestrians
  layout_group: social
- id: encounter_energy_breakdown
  type: bar
  title: Encounter Energy Breakdown
  data:
    computation: group_summary
    params:
      metrics:
      - energy_static_wh
      - energy_mechanical_wh
      - energy_thermal_wh
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
    color: metric
  layout_group: ecological
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_energy_breakdown
  type: bar
  title: Energy Breakdown (%)
  data:
    computation: group_summary
    params:
      metrics:
      - energy_static_wh
      - energy_mechanical_wh
      - energy_thermal_wh
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
    color: metric
  layout_group: ecological
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: box_ecot_local
  type: box
  title: Effective Cost of Transport (E-CoT) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: e_cot
  layout_group: ecological
- id: box_kinetic_energy_demand_local
  type: box
  title: Kinetic Energy Demand (J) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: kinetic_energy_demand_j
  layout_group: ecological
- id: box_friction_dissipation_local
  type: box
  title: Friction Dissipation (J) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: friction_dissipation_j
  layout_group: ecological
- id: timeseries_power
  type: timeseries
  title: Power & Battery Over Time
  data:
    source: v_series_energy
  channels:
    x: time_s
    y: power_total_w
    color: robot_id
  layout_group: ecological
- id: timeseries_velocity
  type: timeseries
  title: Velocity Over Time
  data:
    source: v_series_energy
  channels:
    x: time_s
    y: velocity_linear_mps
    color: robot_id
  layout_group: ecological
- id: box_aeps_local
  type: box
  title: Acoustic Exposure in Personal Space (AEPS) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: aeps_linear_s
  layout_group: ecological
- id: planner_ranking_stability
  type: table
  title: Planner Ranking Stability
  data:
    source: v_planner_scorecard
  channels:
    x: planner
    y:
    - episodes_count
    - success_rate
    - mean_time_to_goal
    - mean_path_efficiency
  layout_group: tradeoffs
- id: planner_behavioral_dendrogram
  type: heatmap
  title: Planner Behavioral Dendrogram
  data:
    computation: correlation_matrix
    params:
      metrics:
      - success
      - time_to_goal
      - path_length_m
      - mean_velocity_mps
      - personal_space_intrusion_integral
  channels:
    x: metric_x
    y: metric_y
    color: pearson_r
  layout_group: tradeoffs
- id: encounter_hierarchy_treemap
  uses: encounter_hierarchy_treemap
  title: Encounter Hierarchy Treemap
  layout_group: tradeoffs
- id: scatter_spl_vs_energy
  type: scatter
  title: Safety-Energy Frontier (SPL vs. Total Energy)
  data:
    source: v_episode_summary
  channels:
    x: energy_total_wh
    y: spl_geodesic
    color: planner
  layout_group: tradeoffs
- id: scatter_time_vs_ecot
  type: scatter
  title: Efficiency-Holistic Frontier (Time to Goal vs. E-CoT)
  data:
    source: v_episode_summary
  channels:
    x: time_to_goal
    y: e_cot
    color: planner
  layout_group: tradeoffs
- id: scatter_velocity_vs_psii
  type: scatter
  title: Speed-Comfort Frontier (Mean Velocity vs. PSII)
  data:
    source: v_episode_summary
  channels:
    x: mean_velocity_mps
    y: personal_space_intrusion_integral
    color: planner
  layout_group: tradeoffs
- id: contact_closing_share
  uses: contact_closing_share
  layout_group: safety
- id: trajectory_plot
  type: trajectory
  title: Spatial Robot Navigation Trajectories with Map Overlays
  data:
    stored_query: robot_tracks_non_ref
  channels:
    x: x
    y: y
    color: robot_id
  layout_group: spatial_trajectories
- id: pedestrian_trajectory_plot
  type: trajectory
  title: Spatial Pedestrian Trajectories & Encounter Corridors
  data:
    stored_query: pedestrian_arena_peds_non_ref
  channels:
    x: x
    y: y
    color: ped_id
  layout_group: spatial_trajectories
