title: Standard Benchmark Report
description: Standard balanced arena_evaluation report covering performance, safety,
  efficiency, naturalness, motion, smoothness, social interaction, ecology, and trade-off
  frontiers.
units:
  acceleration_mean: 'm/s²'
  ade: 'm'
  aeps_linear_s: 's'
  angle_over_length: 'rad/m'
  curvature_mean: '1/m'
  energy_mechanical_wh: 'Wh'
  energy_static_wh: 'Wh'
  energy_thermal_wh: 'Wh'
  energy_total_wh: 'Wh'
  fde: 'm'
  frechet_distance: 'm'
  friction_dissipation_j: 'J'
  idling_time: 's'
  kinetic_energy_demand_j: 'J'
  mean_velocity_mps: 'm/s'
  mhd: 'm'
  path_length_m: 'm'
  personal_space_intrusion_integral: 'm·s'
  power_total_w: 'W'
  roughness_mean: 'rad/m'
  specific_cost_of_transport: ''
  spl_geodesic: ''
  success: '%'
  time_s: 's'
  time_to_goal: 's'
  total_time_in_personal_space: 's'
  total_time_looked_at_by_pedestrians: 's'
  total_time_looking_at_pedestrians: 's'
  tti_min: 's'
  velocity_linear_mps: 'm/s'
summary_group_by:
- local_planner
- world
summary:
- metric: success
  label: Success
  format: '{:.0%}'
- metric: spl_geodesic
  label: SPL
  format: '{:.2f}'
- metric: time_to_goal
  label: Avg Time to Goal
  format: '{:.1f}'
- metric: path_length_m
  label: Avg Path Length
  format: '{:.1f}'
- metric: collision_amount
  label: Collisions
  format: '{:.1f}'
- metric: specific_cost_of_transport
  label: S-CoT
  format: '{:.2f}'
groups:
- id: overview
  title: Performance Overview
- id: safety
  title: Safety & Collision Metrics
- id: efficiency
  title: Efficiency Metrics
- id: naturalness
  title: Trajectory Naturalness & Deviation
- id: motion
  title: Motion Dynamics Metrics
- id: smoothness
  title: Path Smoothness Metrics
- id: social
  title: Social & Pedestrian Interaction
- id: ecological
  title: Ecological & Energy Metrics
- id: tradeoffs
  title: Multi-Objective Trade-Off Frontiers
- id: details
  title: Detailed Run Traces & Analysis
plots:
- id: box_collisions_local
  type: box
  title: Collision Amount by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: local_planner
    color: world
    y: collision_amount
  layout_group: safety
- id: box_collisions_inter
  type: box
  title: Collision Amount by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: collision_amount
  layout_group: safety
- id: box_jerk_local
  type: box
  title: Mean Jerk by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: local_planner
    color: world
    y: jerk_mean
  layout_group: motion
- id: box_jerk_inter
  type: box
  title: Mean Jerk by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: jerk_mean
  layout_group: motion
- id: violin_scot_local
  type: violin
  title: Specific Cost of Transport (S-CoT) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: local_planner
    color: world
    y: specific_cost_of_transport
  layout_group: ecological
- id: violin_scot_inter
  type: violin
  title: Specific Cost of Transport (S-CoT) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: specific_cost_of_transport
  layout_group: ecological
- id: overview_table
  title: Benchmark Executive Overview
  layout_group: overview
  type: table
  data:
    computation: group_summary
    params:
      group_cols:
      - planner_world
      - crowd_condition
      metrics:
      - success
      - spl_geodesic
      - time_to_goal
      - path_length_m
      - path_efficiency
      - collision_amount
      - specific_cost_of_transport
  channels:
    x: planner_world
    color: crowd_condition
    y:
    - metric
    - n
    - mean
    - std
  options:
    labels:
      success: Success
      spl_geodesic: SPL
      time_to_goal: Avg Time
      path_length_m: Avg Path
      path_efficiency: Path Effic.
      collision_amount: Collisions
      specific_cost_of_transport: S-CoT
    format:
      success: '{:.0%}'
      spl_geodesic: '{:.2f}'
      time_to_goal: '{:.1f}'
      path_length_m: '{:.1f}'
      path_efficiency: '{:.2f}'
      collision_amount: '{:.1f}'
      specific_cost_of_transport: '{:.2f}'
- id: e8_success_contact_panel
  uses: success_without_contact_panel
  data:
    computation: group_summary
    params:
      group_cols:
      - local_planner
      - world
      - crowd_condition
  channels:
    x: local_planner
    color: world
  title: Success without Pedestrian Contact by Local Planner, World and Crowd Condition
  layout_group: overview
- id: e8_success_contact_interval
  uses: success_without_contact_interval
  data:
    computation: cluster_bootstrap_ci
    params:
      group_cols:
      - local_planner
      - crowd_condition
  channels:
    x: local_planner
  title: Visible minus Blind Difference in Success without Pedestrian Contact (cluster bootstrap 95% CI)
  layout_group: overview
- id: radar_local_planner
  uses: multi_planner_radar
  data:
    computation: radar_profile
    params:
      group_col: local_planner
  channels:
    color: local_planner
  title: Performance Overview by Local Planner
  layout_group: overview
- id: radar_inter_planner
  type: radar
  title: Performance Overview by Inter-Planner
  data:
    computation: radar_profile
    params:
      group_col: inter_planner
      metrics:
      - success
      - path_efficiency
      - roughness_mean
  channels:
    x: metric
    y: normalized_score
    color: inter_planner
  layout_group: overview
- id: correlation_matrix
  type: heatmap
  title: Metrics Correlation Matrix
  data:
    computation: correlation_matrix
    params:
      metrics:
      - success
      - time_to_goal
      - path_length_m
      - mean_velocity_mps
      - energy_total_wh
      - personal_space_intrusion_integral
  channels:
    x: metric_x
    y: metric_y
    color: pearson_r
  layout_group: overview
- id: heatmap_success_pivot
  type: heatmap
  title: Success Rate Pivot Grid (Local vs Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - planner_world
      - inter_planner
  channels:
    x: inter_planner
    y: planner_world
    color: mean
  layout_group: overview
- id: heatmap_spl_pivot
  type: heatmap
  title: SPL Pivot Grid (Local vs Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - planner_world
      - inter_planner
  channels:
    x: inter_planner
    y: planner_world
    color: mean
  layout_group: overview
- id: bar_success_local
  type: bar
  title: Success Rate by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - local_planner
      - world
  channels:
    x: local_planner
    color: world
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_success_inter
  type: bar
  title: Success Rate by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_spl_local
  type: bar
  title: Success weighted by Path Length (SPL) by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - local_planner
      - world
  channels:
    x: local_planner
    color: world
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_spl_inter
  type: bar
  title: Success weighted by Path Length (SPL) by Inter-Planner
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - inter_planner
  channels:
    x: inter_planner
    y: mean
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: bar_collision_breakdown
  type: bar
  title: Collision Fault Attribution by Obstacle & Crowd Condition
  data:
    computation: group_summary
    params:
      metrics:
      - collision_amount_pedestrian
      - collision_amount_static
      - collision_amount_wall
      group_cols:
      - local_planner
      - world
  channels:
    x: local_planner
    facet_col: world
    y: mean
    color: metric
  layout_group: safety
  options:
    err_plus: err_plus
    err_minus: err_minus
- id: box_tti_min_local
