title: Comprehensive Master Evaluation Report (All Metrics & Perspectives)
description: Exhaustive master report containing every metric, visualization type,
  correlation, and trade-off frontier across all evaluation domains. Serves as inspiration
  for research analytics and autonomous MCP agents.
units:
  acceleration_mean: 'm/s^2'
  ade: 'm'
  adtw: 'm'
  aeps_linear_s: 's'
  angle_over_length: 'rad/m'
  battery_soc_drop_pct: '%'
  collision_amount: ''
  curvature_max: '1/m'
  curvature_mean: '1/m'
  e_cot: ''
  energy_mechanical_wh: 'Wh'
  energy_static_wh: 'Wh'
  energy_thermal_wh: 'Wh'
  energy_total_wh: 'Wh'
  fde: 'm'
  frechet_distance: 'm'
  friction_dissipation_j: 'J'
  idling_time: 's'
  jerk_max_mps3: 'm/s^3'
  jerk_mean: 'm/s^3'
  kinetic_energy_demand_j: 'J'
  max_acceleration_mps2: 'm/s^2'
  max_speed_intimate_zone: 'm/s'
  max_speed_personal_zone: 'm/s'
  mean_velocity_mps: 'm/s'
  mhd: 'm'
  path_efficiency: ''
  path_length_m: 'm'
  ped_path_deflection_m: 'm'
  personal_space_intrusion_integral: 'm*s'
  power_peak_w: 'W'
  power_total_w: 'W'
  roughness_max: 'rad/m'
  roughness_mean: 'rad/m'
  spl_geodesic: ''
  standstill_energy_penalty_wh: 'Wh'
  success: '%'
  time_in_intimate_zone: 's'
  time_s: 's'
  time_to_goal: 's'
  total_time_in_personal_space: 's'
  total_time_looked_at_by_pedestrians: 's'
  total_time_looking_at_pedestrians: 's'
  tti_mean: 's'
  tti_min: 's'
  velocity_linear_mps: 'm/s'
  velocity_max: 'm/s'
summary_group_by:
- local_planner
summary:
- metric: success
  label: Success
  format: '{:.0%}'
- metric: spl_geodesic
  label: SPL
  format: '{:.2f}'
- metric: time_to_goal
  label: Avg Time to Goal
  format: '{:.1f}'
- metric: path_efficiency
  label: Path Efficiency
  format: '{:.2f}'
- metric: collision_amount
  label: Collisions
  format: '{:.1f}'
- metric: energy_total_wh
  label: Total Energy
  format: '{:.2f}'
- metric: e_cot
  label: E-CoT
  format: '{:.2f}'
groups:
- id: executive_overview
  title: 1. Executive Overview & Multi-Domain Radar Profiles
- id: correlation_and_pivots
  title: 2. Correlation Matrix & Strategic Pivot Grids
- id: safety_and_collisions
  title: 3. Safety Integrity, Collisions & Reaction Margins
- id: path_efficiency_and_time
  title: 4. Geodesic Efficiency & Temporal Dynamics
- id: trajectory_naturalness
  title: 5. Trajectory Naturalness & Deviation vs Theta* Baseline
- id: motion_kinematics
  title: 6. Kinematic Dynamics & Motion Profiles
- id: path_smoothness
  title: 7. Geometric Smoothness, Curvature & Roughness
- id: proxemics_and_personal_space
  title: 8. Proxemics Zones & Personal Space Intrusion (PSII)
- id: social_etiquette_and_forces
  title: 9. Passing Etiquette, Directional Forces & Mutual Gaze
- id: energy_and_cost_of_transport
  title: 10. Electrical Energy, S-CoT & Holistic E-CoT
- id: dynamic_dissipation_and_losses
  title: 11. Kinetic Demand, Friction Losses & Compliance Costs
- id: environmental_acoustics
  title: 12. Environmental Acoustic Emissions & Personal Space Exposure
- id: time_series_profiles
  title: 13. Synchronized Power, Velocity & Battery Timeseries
- id: multi_objective_tradeoffs
  title: 14. Multi-Objective Trade-Off Frontiers & Pareto Analyses
- id: spatial_trajectories
  title: 15. Spatial Robot & Pedestrian Trajectory Overlays
plots:
- id: violin_scot_local
  type: violin
  title: Specific Cost of Transport (S-CoT) by Local Planner
  data:
    source: v_episode_summary
  channels:
    x: planner
    y: specific_cost_of_transport
  layout_group: energy_and_cost_of_transport
- id: violin_scot_inter
  type: violin
  title: Specific Cost of Transport (S-CoT) by Inter-Planner
  data:
    source: v_episode_summary
  channels:
    x: inter_planner
    y: specific_cost_of_transport
  layout_group: energy_and_cost_of_transport
- id: master_summary_table
  type: table
  title: Cross-Domain Executive Performance Matrix
  data:
    computation: group_summary
    params:
      metrics:
      - success
      - spl_geodesic
      - time_to_goal
      - path_efficiency
      - collision_amount
      - passing_rule_compliance
      - personal_space_intrusion_integral
      - energy_total_wh
      - specific_cost_of_transport
      - e_cot
      group_cols:
      - local_planner
      - crowd_condition
  channels:
    x: local_planner
    color: crowd_condition
    y:
    - metric
    - n
    - mean
    - std
  layout_group: executive_overview
  options:
    labels:
      success: Success
      spl_geodesic: SPL
      time_to_goal: Avg Time (s)
      path_efficiency: Path Effic.
      collision_amount: Collisions
      passing_rule_compliance: Passing Compl.
      personal_space_intrusion_integral: PSII (m*s)
      energy_total_wh: Energy (Wh)
      specific_cost_of_transport: S-CoT
      e_cot: E-CoT
    format:
      success: '{:.0%}'
      spl_geodesic: '{:.2f}'
      time_to_goal: '{:.1f}'
      path_efficiency: '{:.2f}'
      collision_amount: '{:.1f}'
      passing_rule_compliance: '{:.0%}'
      personal_space_intrusion_integral: '{:.2f}'
      energy_total_wh: '{:.2f}'
      specific_cost_of_transport: '{:.2f}'
      e_cot: '{:.2f}'
- id: radar_master_local_planner
  type: radar
  title: Comprehensive Performance Radar by Local Planner
  data:
    computation: radar_profile
    params:
      group_col: local_planner
      metrics:
      - success
      - spl_geodesic
      - path_efficiency
      - relative_throughput
      - collision_amount
      - jerk_mean
      - personal_space_intrusion_integral
      - specific_cost_of_transport
      - e_cot
  channels:
    x: metric
    y: normalized_score
    color: local_planner
  layout_group: executive_overview
- id: radar_master_inter_planner
  type: radar
  title: Comprehensive Performance Radar by Inter-Planner
  data:
    computation: radar_profile
    params:
      group_col: inter_planner
      metrics:
      - success
      - spl_geodesic
      - path_efficiency
      - relative_throughput
      - collision_amount
      - jerk_mean
      - personal_space_intrusion_integral
      - specific_cost_of_transport
      - e_cot
  channels:
    x: metric
    y: normalized_score
    color: inter_planner
  layout_group: executive_overview
- id: radar_safety_domain
  type: radar
  title: Safety Domain Focused Profile
  data:
    computation: radar_profile
    params:
      group_col: local_planner
      metrics:
      - success
      - spl_geodesic
      - collision_amount
      - tti_min
      - jerk_mean
  channels:
    x: metric
    y: normalized_score
    color: local_planner
  layout_group: executive_overview
- id: radar_social_domain
  type: radar
  title: Social Co-Navigation Focused Profile
  data:
    computation: radar_profile
    params:
      group_col: local_planner
      metrics:
      - personal_space_intrusion_integral
      - time_in_intimate_zone
      - tti_min
  channels:
    x: metric
    y: normalized_score
    color: local_planner
  layout_group: executive_overview
- id: radar_ecological_domain
  type: radar
  title: Ecological & Transport Efficiency Profile
  data:
    computation: radar_profile
    params:
      group_col: local_planner
      metrics:
      - energy_total_wh
      - specific_cost_of_transport
      - e_cot
      - energy_mechanical_wh
      - kinetic_energy_demand_j
      - spl_geodesic
  channels:
    x: metric
    y: normalized_score
    color: local_planner
  layout_group: executive_overview
- id: global_correlation_matrix
  type: heatmap
  title: Global All-Metrics Correlation Matrix
  data:
    computation: correlation_matrix
    params:
      metrics:
      - success
      - time_to_goal
      - path_length_m
      - mean_velocity_mps
      - energy_total_wh
      - personal_space_intrusion_integral
  channels:
    x: metric_x
    y: metric_y
    color: pearson_r
  layout_group: correlation_and_pivots
- id: heatmap_success_pivot
  type: heatmap
  title: Success Rate Pivot Matrix (Local vs. Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: correlation_and_pivots
- id: heatmap_spl_pivot
  type: heatmap
  title: SPL Pivot Matrix (Local vs. Inter Planner)
  data:
    computation: group_summary
    params:
      metrics:
      - spl_geodesic
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: correlation_and_pivots
- id: heatmap_ecot_pivot
  type: heatmap
  title: Effective Cost of Transport (E-CoT) Pivot Matrix
  data:
    computation: group_summary
    params:
      metrics:
      - e_cot
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: correlation_and_pivots
- id: heatmap_psii_pivot
  type: heatmap
  title: Personal Space Intrusion (PSII) Pivot Matrix
  data:
    computation: group_summary
    params:
      metrics:
      - personal_space_intrusion_integral
      group_cols:
      - local_planner
      - inter_planner
  channels:
    x: inter_planner
    y: local_planner
    color: mean
  layout_group: correlation_and_pivots
- id: bar_success_local
  type: bar
  title: Navigation Success Rate by Local Planner
  data:
    computation: group_summary
    params:
      metrics:
      - success
      group_cols:
      - planner
  channels:
    x: planner
    y: mean
  layout_group: safety_and_collisions
