max_episodes: 1000 # terminates simulation upon reaching xth episode
max_time: 12000 # terminates simulation after x seconds

# Per-topic throttle rates in Hz, keyed by the exact topic name subscribed
# (for example "/env_0/jackal/scan"). A topic absent here keeps the rate of its
# TopicDefinition; 0 means unthrottled. The former record_frequencies key
# (milliseconds, substring keys) is refused by the loader: use record_rates_hz.
record_rates_hz:
  /tf: 20.0 # default minimum interval per (parent, child) frame pair, tf_frames overrides it per family

# Per-frame minimum /tf interval in milliseconds, matched against the child frame in order.
tf_frames:
  - ["^body_env_\\d+_agent_\\d+$", 0.0]   # pedestrian root, every window
  - ["_agent_\\d+$", 200.0]               # skeleton bones, 5 Hz
